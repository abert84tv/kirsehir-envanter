<sc-if value="{{ koyAta.acik }}" hint-placeholder-val="{{ false }}">
<div class="ks-ata" style="background:{{ ui.bg }};color:{{ ui.fg }}">
<div style="flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid {{ ui.rule }};background:{{ ui.surf }}">
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font:700 17px/1.1 var(--font-heading)">Köy ata</span><span style="font:500 12.5px/1.2 var(--font-body);color:{{ ui.mut }}">{{ koyAta.ozet }}</span></span>
<button onClick="{{ koyAta.kapat }}" style="all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;padding:0 18px;border-radius:11px;border:1px solid {{ ui.rule }};font:600 13.5px/42px var(--font-body);color:{{ ui.fg }}">Kapat</button>
</div>
<sc-if value="{{ koyAta.bosYok }}" hint-placeholder-val="{{ false }}">
<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:30px;font:600 15px/1.4 var(--font-body);color:{{ ui.mut }};text-align:center">Köyü boş kayıt kalmadı.</div>
</sc-if>
<sc-if value="{{ koyAta.bosDegil }}" hint-placeholder-val="{{ true }}">
<div class="ks-ata-ic">
<div class="ks-ata-harita"><iframe id="ks-koyata-harita" src="ozet-harita.html#ata" title="Köyü boş kayıtlar" style="position:absolute;inset:0;width:100%;height:100%;border:none;display:block"></iframe></div>
<div class="ks-ata-panel scroll">
<div style="padding:12px 14px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid {{ ui.rule }}">
<span style="font:500 12.5px/1.45 var(--font-body);color:{{ ui.mut }}">Turuncu nokta = köyü boş kayıt. Dokunup seçin (mavi olur), sonra köyü seçin ve “Ata”ya basın.</span>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button onClick="{{ koyAta.hepsi }}" style="all:unset;box-sizing:border-box;cursor:pointer;min-height:38px;padding:0 13px;border-radius:10px;border:1px solid {{ ui.rule }};font:600 12.5px/36px var(--font-body);color:{{ ui.fg }}">Hepsini seç</button>
<sc-if value="{{ koyAta.cevreVar }}" hint-placeholder-val="{{ false }}"><button onClick="{{ koyAta.cevre }}" style="all:unset;box-sizing:border-box;cursor:pointer;min-height:38px;padding:0 13px;border-radius:10px;border:1px solid var(--color-accent);font:600 12.5px/36px var(--font-body);color:{{ ui.acc }}">Çevresindekileri de seç (3 km)</button></sc-if>
<sc-if value="{{ koyAta.cevreVar }}" hint-placeholder-val="{{ false }}"><button onClick="{{ koyAta.temizle }}" style="all:unset;box-sizing:border-box;cursor:pointer;min-height:38px;padding:0 13px;border-radius:10px;border:1px solid {{ ui.rule }};font:600 12.5px/36px var(--font-body);color:{{ ui.mut }}">Seçimi bırak</button></sc-if>
</div>
<sc-if value="{{ koyAta.adayVar }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:7px">
<span style="font:700 12px/1 var(--font-body);color:{{ ui.mut }}">Seçilenlere yakın köyler</span>
<div style="display:flex;gap:7px;flex-wrap:wrap">
<sc-for list="{{ koyAta.adaylar }}" as="v" hint-placeholder-count="4">
<button onClick="{{ v.sec }}" style="all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;padding:0 13px;border-radius:12px;border:1px solid {{ v.kenar }};background:{{ v.bg }};color:{{ v.fg }};display:flex;flex-direction:column;justify-content:center;gap:3px"><span style="font:700 13px/1 var(--font-body)">{{ v.ad }}</span><span style="font:500 11px/1 var(--font-body);opacity:.75">{{ v.alt }}</span></button>
</sc-for>
</div>
</div>
</sc-if>
<div style="display:flex;flex-direction:column;gap:7px">
<span style="font:700 12px/1 var(--font-body);color:{{ ui.mut }}">Başka köy ara</span>
<input value="{{ koyAta.q }}" onChange="{{ koyAta.onQ }}" placeholder="Köy adı yazın" autocomplete="off" style="all:unset;box-sizing:border-box;width:100%;min-height:44px;padding:0 14px;border-radius:11px;border:1px solid {{ ui.rule }};background:{{ ui.surf }};color:{{ ui.fg }};font:500 14px/42px var(--font-body)">
<sc-if value="{{ koyAta.sonucVar }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;gap:7px;flex-wrap:wrap">
<sc-for list="{{ koyAta.sonuclar }}" as="v" hint-placeholder-count="3">
<button onClick="{{ v.sec }}" style="all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;padding:0 13px;border-radius:12px;border:1px solid {{ v.kenar }};background:{{ v.bg }};color:{{ v.fg }};display:flex;flex-direction:column;justify-content:center;gap:3px"><span style="font:700 13px/1 var(--font-body)">{{ v.ad }}</span><span style="font:500 11px/1 var(--font-body);opacity:.75">{{ v.alt }}</span></button>
</sc-for>
</div>
</sc-if>
</div>
</div>
<sc-for list="{{ koyAta.satirlar }}" as="r" hint-placeholder-count="6">
<div style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid {{ ui.rule }};background:{{ r.bg }}">
<button onClick="{{ r.tik }}" aria-label="Seç" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:26px;height:26px;border-radius:8px;border:2px solid {{ r.kutuKenar }};background:{{ r.kutu }};color:#fff;display:flex;align-items:center;justify-content:center;font:700 15px/1">{{ r.isaret }}</button>
<button onClick="{{ r.tik }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:1;min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center;gap:3px"><span style="font:700 13.5px/1.1 var(--font-body);color:{{ ui.fg }}">{{ r.kod }}</span><span style="font:400 12px/1.25 var(--font-body);color:{{ ui.mut }}">{{ r.ilce }} · en yakın: {{ r.oneri }} {{ r.oneriKm }}</span></button>
<sc-if value="{{ r.hizliVar }}" hint-placeholder-val="{{ true }}"><button onClick="{{ r.hizli }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;min-height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--color-accent);font:600 12px/36px var(--font-body);color:{{ ui.acc }}">Bunu yaz</button></sc-if>
</div>
</sc-for>
</div>
</div>
<div style="flex:none;padding:10px 14px;border-top:1px solid {{ ui.rule }};background:{{ ui.surf }};display:flex;align-items:center;gap:12px;flex-wrap:wrap">
<span style="flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font:700 13px/1.1 var(--font-body)">{{ koyAta.secMetin }}</span><span style="font:500 12px/1.2 var(--font-body);color:{{ ui.mut }}">Yazılacak köy: {{ koyAta.hedefMetin }}</span></span>
<button onClick="{{ koyAta.uygula }}" style="all:unset;box-sizing:border-box;cursor:pointer;min-height:50px;padding:0 22px;border-radius:12px;background:{{ koyAta.dugmeBg }};color:{{ koyAta.dugmeFg }};font:700 14.5px/50px var(--font-body)">{{ koyAta.dugme }}</button>
</div>
</sc-if>
</div>
</sc-if>
