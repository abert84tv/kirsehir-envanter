<sc-if value="{{ buyut.on }}" hint-placeholder-val="{{ false }}">
<div style="position:fixed;inset:0;z-index:90;background:rgba(18,17,16,.96);display:flex;flex-direction:column">
<div style="display:flex;align-items:center;gap:8px;padding:10px 10px;border-bottom:1px solid rgba(255,255,255,.22);color:#fff">
<span style="font:600 12.5px/1 var(--font-body);letter-spacing:-.01em;color:var(--color-accent);flex:none">{{ buyut.sayac }}</span>
<span style="flex:1;min-width:0;font:400 12px/1.3 var(--font-body);color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ buyut.meta }}</span>
<button onClick="{{ buyut.indir }}" aria-label="Cihaza indir" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid rgba(255,255,255,.35);color:#fff">{{ ikonlar.indir }}</button>
<button onClick="{{ buyut.kapat }}" aria-label="Kapat" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid rgba(255,255,255,.35);color:#fff">{{ ikonlar.kapatBuyuk }}</button>
</div>
<div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px">{{ buyut.img }}</div>
<sc-if value="{{ buyut.coklu }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;gap:8px;padding:10px;border-top:1px solid rgba(255,255,255,.22)">
<button onClick="{{ buyut.onceki }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:1;height:52px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid rgba(255,255,255,.35);color:#fff">{{ ikonlar.sol }}</button>
<button onClick="{{ buyut.sonraki }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:1;height:52px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid rgba(255,255,255,.35);color:#fff">{{ ikonlar.sag }}</button>
</div>
</sc-if>
</div>
</sc-if>
