<div style="padding:14px 16px;border-bottom:1px solid {{ ui.rule }};display:flex;flex-direction:column;gap:10px">
<div style="display:flex;flex-direction:column;gap:4px">
<span style="font:700 15px/1.2 var(--font-heading)">Toplu veri girişi (Excel)</span>
<span style="font:400 12.5px/1.5 var(--font-body);color:{{ ui.mut }}">Kuyu ya da depo bilgilerini tek tek girmek yerine: şablonu indirin, Excel’de doldurun (derinlik, debi, pompa gücü, yapım yılı…), kaydedip geri yükleyin. Boş bıraktığınız hücre mevcut bilgiyi silmez.</span>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button onClick="{{ topluGiris.kuyuSablon }}" style="all:unset;box-sizing:border-box;cursor:pointer;min-height:42px;padding:0 14px;border-radius:10px;border:1px solid {{ ui.rule }};font:600 12.5px/40px var(--font-body);color:{{ ui.fg }}">Kuyu şablonunu indir ({{ topluGiris.kuyuSayi }})</button>
<button onClick="{{ topluGiris.depoSablon }}" style="all:unset;box-sizing:border-box;cursor:pointer;min-height:42px;padding:0 14px;border-radius:10px;border:1px solid {{ ui.rule }};font:600 12.5px/40px var(--font-body);color:{{ ui.fg }}">Depo şablonunu indir ({{ topluGiris.depoSayi }})</button>
<button onClick="{{ topluGiris.yukle }}" style="all:unset;box-sizing:border-box;cursor:pointer;min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--color-accent);font:600 12.5px/40px var(--font-body);color:{{ ui.acc }}">Doldurulmuş dosyayı yükle</button>
</div>
</div>
