<sc-if value="{{ ayar.denetim }}" hint-placeholder-val="{{ false }}">
<div>
<div style="padding:16px 20px;border-bottom:1px solid {{ ui.rule }}">
<div style="font:600 11px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.acc }};margin-bottom:6px">Denetim izi</div>
<div class="ks-bilgi" style="font:400 12.5px/1.5 var(--font-body);color:{{ ui.mut }};max-width:820px">{{ denetimEkran.not }}</div>
</div>
<div style="display:flex;border-bottom:1px solid {{ ui.rule }}">
<sc-for list="{{ denetimEkran.stats }}" as="st" hint-placeholder-count="4">
<div style="flex:1;padding:14px 18px;border-right:1px solid {{ ui.rule }};display:flex;flex-direction:column;gap:4px">
<span style="font:600 26px/1 var(--font-heading);letter-spacing:-.022em;color:{{ st.fg }}">{{ st.n }}</span>
<span style="font:600 10.5px/1.2 var(--font-body);letter-spacing:-.01em;color:{{ ui.mut }}">{{ st.label }}</span>
</div>
</sc-for>
</div>
<div style="padding:14px 20px;border-bottom:1px solid {{ ui.rule }};background:{{ ui.surf }};display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
<label style="flex:2 1 240px;display:flex;flex-direction:column;gap:5px;min-width:0">
<span style="font:600 11px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.mut }}">Ara</span>
<input value="{{ denetimEkran.q }}" onChange="{{ denetimEkran.onQ }}" type="search" placeholder="işlem, kayıt kodu, kişi, tarih" style="all:unset;box-sizing:border-box;border-radius:10px;border:1px solid {{ ui.rule }};padding:11px;font:600 13px/1 var(--font-body);color:{{ ui.fg }};background:{{ ui.bg }}">
</label>
<label style="flex:1 1 190px;display:flex;flex-direction:column;gap:5px;min-width:0">
<span style="font:600 11px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.mut }}">Kullanıcı</span>
<select value="{{ denetimEkran.kim }}" onChange="{{ denetimEkran.onKim }}" style="all:unset;box-sizing:border-box;border-radius:10px;border:1px solid {{ ui.rule }};padding:11px;font:600 13px/1 var(--font-body);color:{{ ui.fg }};background:{{ ui.bg }};cursor:pointer">
<option value="">Hepsi</option>
<sc-for list="{{ denetimEkran.kimler }}" as="k" hint-placeholder-count="3">
<option value="{{ k }}">{{ k }}</option>
</sc-for>
</select>
</label>
<button onClick="{{ denetimEkran.csv }}" class="btn btn-primary" style="flex:none;border:none;cursor:pointer;font:600 12.5px/1 var(--font-body);padding:12px 16px;justify-content:flex-start">CSV indir</button>
</div>
<div style="display:flex;flex-wrap:wrap;border-bottom:1px solid {{ ui.rule }}">
<sc-for list="{{ denetimEkran.sinifSec }}" as="c" hint-placeholder-count="9">
<button onClick="{{ c.pick }}" style="all:unset;box-sizing:border-box;cursor:pointer;padding:11px 15px;background:{{ c.bg }};color:{{ c.fg }};font:600 11.5px/1 var(--font-body);letter-spacing:-.01em;border-right:1px solid {{ ui.rule }}">{{ c.label }}</button>
</sc-for>
</div>
<sc-if value="{{ denetimEkran.bos }}" hint-placeholder-val="{{ true }}">
<div style="padding:16px 20px;font:400 12.5px/1.5 var(--font-body);color:{{ ui.mut }};max-width:700px">{{ denetimEkran.bosNot }}</div>
</sc-if>
<sc-for list="{{ denetimEkran.satirlar }}" as="r" hint-placeholder-count="0">
<div style="padding:10px 20px;border-bottom:1px solid {{ ui.rule }};display:flex;flex-direction:column;gap:3px">
<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
<span style="flex:none;width:112px;font:400 12px/1.2 ui-monospace,Menlo,monospace;color:{{ ui.mut }}">{{ r.t }}</span>
<span style="flex:none;width:74px;font:600 11px/1.2 var(--font-body);letter-spacing:-.01em;color:{{ r.sinifFg }}">{{ r.sinif }}</span>
<span style="flex:1 1 220px;min-width:0;font:600 12.5px/1.3 var(--font-body);color:{{ ui.fg }};text-wrap:pretty">{{ r.ne }}</span>
<span style="flex:none;font:600 12.5px/1.2 var(--font-body);color:{{ ui.fg }}">{{ r.kapsam }}</span>
</div>
<span style="font:400 12px/1.4 var(--font-body);color:{{ ui.mut }};text-wrap:pretty">{{ r.detay }}</span>
<span style="font:400 11.5px/1.3 var(--font-body);color:{{ ui.mut }}">{{ r.kim }} · {{ r.nereden }}</span>
</div>
</sc-for>
<div style="padding:11px 20px;font:400 12px/1.4 var(--font-body);color:{{ ui.mut }}">{{ denetimEkran.fazla }}</div>
</div>
</sc-if>
