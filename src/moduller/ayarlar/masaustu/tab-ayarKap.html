<!-- ayarlar -->
<sc-if value="{{ tab.ayarKap }}" hint-placeholder-val="{{ false }}">
<div style="flex:1;display:flex;min-height:0;background:{{ ui.bg }}">
<div class="scroll" style="flex:none;width:264px;overflow:auto;border-right:1px solid {{ ui.rule }};background:{{ ui.surf }};padding:4px 10px 24px">
<sc-for list="{{ ayarListe }}" as="g" hint-placeholder-count="3">
<div style="padding:18px 10px 6px;font:600 11.5px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.mut }}">{{ g.baslik }}</div>
<sc-for list="{{ g.satirlar }}" as="r" hint-placeholder-count="3">
<button onClick="{{ r.git }}" style="all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;margin-bottom:2px;border-radius:10px;background:{{ r.zemin }}" style-hover="background:{{ ui.surf2 }}">
<span style="flex:1;min-width:0;font:500 14.5px/1.25 var(--font-body);letter-spacing:-.015em;color:{{ r.renk }}">{{ r.ad }}</span>
<span style="flex:none;font:700 11.5px/1 var(--font-body);color:{{ ui.mut }}">{{ r.rozet }}</span>
</button>
</sc-for>
</sc-for>
</div>
<div class="scroll" style="flex:1;min-width:0;overflow:auto">
<sc-if value="{{ ayar.detay }}" hint-placeholder-val="{{ false }}">
<div style="flex:none;display:flex;align-items:center;gap:12px;padding:14px 20px 4px;background:{{ ui.bg }}">
<span style="font:600 19px/1.2 var(--font-heading);letter-spacing:-.022em;color:{{ ui.fg }}">{{ ayar.bolumAd }}</span>
</div>
</sc-if>

<sc-if value="{{ ayar.yetki }}" hint-placeholder-val="{{ false }}">
<div style="padding:16px 20px 12px">
<div style="font:600 11px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.acc }};margin-bottom:6px">Roller ve yetkiler</div>
<div class="ks-bilgi" style="font:400 12.5px/1.5 var(--font-body);color:{{ ui.mut }};max-width:760px">{{ perm.note }}</div>
</div>
</sc-if>
