<sc-if value="{{ pickBar.on }}" hint-placeholder-val="{{ false }}">
<div style="position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--color-accent);color:#fff;padding:13px 20px;display:flex;align-items:center;gap:16px">
<span style="flex:1;font:600 13.5px/1.3 var(--font-body)">{{ pickBar.text }}</span>
<button onClick="{{ pickBar.cancel }}" style="all:unset;box-sizing:border-box;cursor:pointer;border-radius:10px;border:1px solid #fff;color:#fff;font:600 11.5px/1 var(--font-body);letter-spacing:-.01em;padding:11px 13px">Vazgeç</button>
</div>
</sc-if>
