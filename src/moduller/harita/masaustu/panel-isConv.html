<sc-if value="{{ panel.isConv }}" hint-placeholder-val="{{ true }}">
<div style="padding:16px 62px 16px 18px;border-bottom:1px solid {{ ui.rule }};display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
<div>
<div style="font:600 11px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.acc }};margin-bottom:7px">Araç</div>
<div style="font:600 21px/1.05 var(--font-heading);letter-spacing:-.022em">Koordinat dönüşümü</div>
<div style="font:400 12.5px/1.4 var(--font-body);color:{{ ui.mut }};margin-top:6px">ED50 ↔ ITRF96-3° ↔ WGS84 / Google</div>
</div>
</div>
<div style="padding:16px 18px">
<div style="display:flex;border-radius:10px;border:1px solid {{ ui.rule }};margin-bottom:14px">
<sc-for list="{{ convSystems }}" as="c" hint-placeholder-count="3">
<button onClick="{{ c.pick }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:left;padding:10px 10px;font:600 11px/1.2 var(--font-body);letter-spacing:-.01em;background:{{ c.bg }};color:{{ c.fg }};border-right:1px solid {{ ui.rule }}">{{ c.label }}</button>
</sc-for>
</div>
<div style="display:flex;gap:10px;margin-bottom:11px">
<label style="flex:1;display:flex;flex-direction:column;gap:5px">
<span style="font:600 11px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.mut }}">{{ conv.labelE }}</span>
<input value="{{ conv.e }}" onChange="{{ onConvE }}" placeholder="{{ conv.phE }}" style="all:unset;border-radius:10px;border:1px solid {{ ui.rule }};padding:10px;font:600 14.5px/1 ui-monospace,Menlo,monospace;color:{{ ui.fg }};background:{{ ui.bg }}">
</label>
<sc-if value="{{ conv.notDms }}" hint-placeholder-val="{{ true }}">
<label style="width:96px;display:flex;flex-direction:column;gap:5px">
<span style="font:600 11px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.mut }}">Dilim</span>
<select value="{{ conv.zone }}" onChange="{{ onConvZone }}" style="all:unset;border-radius:10px;border:1px solid {{ ui.rule }};padding:10px;font:600 14.5px/1 ui-monospace,Menlo,monospace;color:{{ ui.fg }};background:{{ ui.bg }};cursor:pointer">
<option value="11">11 · 33°</option>
<option value="12">12 · 36°</option>
</select>
</label>
</sc-if>
</div>
<label style="display:flex;flex-direction:column;gap:5px;margin-bottom:15px">
<span style="font:600 11px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.mut }}">{{ conv.labelN }}</span>
<input value="{{ conv.n }}" onChange="{{ onConvN }}" placeholder="{{ conv.phN }}" style="all:unset;border-radius:10px;border:1px solid {{ ui.rule }};padding:10px;font:600 14.5px/1 ui-monospace,Menlo,monospace;color:{{ ui.fg }};background:{{ ui.bg }}">
</label>
<div style="border-top:1px solid var(--color-accent);padding-top:11px">
<sc-for list="{{ conv.out }}" as="o" hint-placeholder-count="3">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid {{ ui.rule }}">
<span style="font:600 11px/1.3 var(--font-body);letter-spacing:-.01em;color:{{ ui.mut }}">{{ o.label }}</span>
<span style="font:600 13px/1.3 ui-monospace,Menlo,monospace;color:{{ ui.fg }};text-align:right">{{ o.value }}</span>
</div>
</sc-for>
<div style="font:400 12px/1.5 var(--font-body);color:{{ ui.mut }};margin:11px 0 13px">{{ conv.note }}</div>
<button onClick="{{ flyToConv }}" class="btn btn-primary" style="width:100%;justify-content:flex-start;border:none;cursor:pointer;font:600 13px/1 var(--font-body);padding:13px 15px">Haritada göster</button>
</div>
</div>
</sc-if>
