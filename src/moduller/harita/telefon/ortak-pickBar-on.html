<sc-if value="{{ pickBar.on }}" hint-placeholder-val="{{ false }}">
<div style="position:fixed;left:0;right:0;bottom:var(--tel-nav);z-index:70;background:var(--color-accent);color:#fff;padding:11px 12px;display:flex;align-items:center;gap:10px">
<span style="flex:1;font:600 13px/1.3 var(--font-body)">{{ pickBar.text }}</span>
<button onClick="{{ pickBar.cancel }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;min-height:44px;display:flex;align-items:center;border-radius:10px;border:1px solid #fff;color:#fff;font:600 11.5px/1 var(--font-body);letter-spacing:-.01em;padding:0 14px">Vazgeç</button>
</div>
</sc-if>
