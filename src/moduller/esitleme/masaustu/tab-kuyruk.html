<sc-if value="{{ tab.kuyruk }}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="flex:1;overflow:auto;min-height:0;background:{{ ui.bg }}">
<div style="display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid {{ ui.rule }};background:{{ ui.surf }}">
<h2 style="font:600 19px/1 var(--font-heading);letter-spacing:-.022em;margin:0">Eşitleme kuyruğu</h2>
<span style="font:400 12.5px/1 var(--font-body);color:{{ ui.mut }}">{{ queue.summary }}</span>
<span style="flex:1"></span>
<button onClick="{{ syncNow }}" class="btn btn-primary" style="border:none;cursor:pointer;font:600 12.5px/1 var(--font-body);padding:11px 15px;justify-content:flex-start;opacity:{{ queue.canSync }}">{{ queue.cta }}</button>
</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid {{ ui.rule }};background:{{ ui.surf }}">
<sc-for list="{{ queue.stats }}" as="s" hint-placeholder-count="3">
<div style="padding:13px 18px;border-right:1px solid {{ ui.rule }}">
<div style="font:600 23px/1 var(--font-heading);letter-spacing:-.022em;color:{{ s.color }}">{{ s.n }}</div>
<div style="font:600 10.5px/1.2 var(--font-body);letter-spacing:-.01em;color:{{ ui.mut }};margin-top:5px">{{ s.label }}</div>
</div>
</sc-for>
</div>
<sc-for list="{{ queue.items }}" as="q" hint-placeholder-count="4">
<div style="display:flex;gap:13px;align-items:center;padding:12px 20px;border-bottom:1px solid {{ ui.rule }}">
<span style="width:8px;height:8px;background:{{ q.dot }};flex:none"></span>
<span style="flex:1;font:600 13.5px/1.3 var(--font-body);color:{{ ui.fg }}">{{ q.title }}</span>
<span style="font:400 12.5px/1 var(--font-body);color:{{ ui.mut }};width:280px">{{ q.meta }}</span>
<span style="font:600 10.5px/1 var(--font-body);letter-spacing:-.01em;color:{{ q.dot }};width:90px;text-align:right">{{ q.state }}</span>
</div>
</sc-for>
<div style="padding:14px 20px;font:400 12.5px/1.5 var(--font-body);color:{{ ui.mut }}">{{ queue.hint }}</div>
</div>
</sc-if>
