<sc-if value="{{ tab.envanter }}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="flex:1;overflow:auto;min-height:0">
<div style="display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-bottom:1px solid {{ ui.rule }};background:{{ ui.surf }}">
<input value="{{ envKontrol.q }}" onChange="{{ envKontrol.onQ }}" placeholder="Envanterde ara — kod, köy, ilçe, alan" style="all:unset;box-sizing:border-box;width:100%;border-radius:10px;border:1px solid {{ ui.rule }};background:{{ ui.bg }};color:{{ ui.fg }};font:600 13px/1 var(--font-body);padding:12px 11px;min-height:46px"></input>
<button onClick="{{ telSuz.listeTog }}" style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid {{ telSuz.listeKenar }};background:{{ ui.bg }};color:{{ ui.fg }};font:600 13px/1 var(--font-body)"><span>Süzgeç ve sıralama</span><span style="color:{{ ui.mut }};font-size:11px">{{ telSuz.listeEtiket }} {{ telSuz.listeOk }}</span></button>
<sc-if value="{{ telSuz.listeAcik }}" hint-placeholder-val="{{ false }}">
<div class="ks-gir" style="display:flex;flex-direction:column;gap:8px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<select value="{{ envKontrol.turVal }}" onChange="{{ envKontrol.onTur }}" style="all:unset;box-sizing:border-box;width:100%;border-radius:10px;border:1px solid {{ ui.rule }};background:{{ ui.bg }};color:{{ ui.fg }};font:600 12.5px/1 var(--font-body);padding:11px 8px;min-height:44px;cursor:pointer"><sc-for list="{{ envKontrol.turler }}" as="o" hint-placeholder-count="5"><option value="{{ o.v }}">{{ o.n }}</option></sc-for></select>
<select value="{{ envKontrol.ilceVal }}" onChange="{{ envKontrol.onIlceF }}" style="all:unset;box-sizing:border-box;width:100%;border-radius:10px;border:1px solid {{ ui.rule }};background:{{ ui.bg }};color:{{ ui.fg }};font:600 12.5px/1 var(--font-body);padding:11px 8px;min-height:44px;cursor:pointer"><sc-for list="{{ envKontrol.ilceler }}" as="o" hint-placeholder-count="8"><option value="{{ o.v }}">{{ o.n }}</option></sc-for></select>
<select value="{{ envKontrol.aktiflikVal }}" onChange="{{ envKontrol.onAktiflik }}" style="all:unset;box-sizing:border-box;width:100%;border-radius:10px;border:1px solid {{ ui.rule }};background:{{ ui.bg }};color:{{ ui.fg }};font:600 12.5px/1 var(--font-body);padding:11px 8px;min-height:44px;cursor:pointer"><sc-for list="{{ envKontrol.aktiflikler }}" as="o" hint-placeholder-count="4"><option value="{{ o.v }}">{{ o.n }}</option></sc-for></select>
<select value="{{ envKontrol.durumVal }}" onChange="{{ envKontrol.onDurum }}" style="all:unset;box-sizing:border-box;width:100%;border-radius:10px;border:1px solid {{ ui.rule }};background:{{ ui.bg }};color:{{ ui.fg }};font:600 12.5px/1 var(--font-body);padding:11px 8px;min-height:44px;cursor:pointer"><sc-for list="{{ envKontrol.durumlar }}" as="o" hint-placeholder-count="4"><option value="{{ o.v }}">{{ o.n }}</option></sc-for></select>
<div style="display:flex;gap:8px;min-width:0">
<select value="{{ envKontrol.siraVal }}" onChange="{{ envKontrol.onSira }}" style="all:unset;box-sizing:border-box;width:100%;border-radius:10px;border:1px solid {{ ui.rule }};background:{{ ui.bg }};color:{{ ui.fg }};font:600 12.5px/1 var(--font-body);padding:11px 8px;min-height:44px;cursor:pointer"><sc-for list="{{ envKontrol.siraOpts }}" as="o" hint-placeholder-count="6"><option value="{{ o.v }}">{{ o.n }}</option></sc-for></select>
<button onClick="{{ envKontrol.yonTik }}" title="Sıra yönünü çevir" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;border-radius:10px;border:1px solid {{ ui.rule }};color:{{ ui.fg }};font:600 11.5px/1 var(--font-body);letter-spacing:-.01em;padding:0 12px;min-height:36px;flex:1 0 auto;white-space:nowrap;justify-content:center;display:flex;align-items:center">{{ envKontrol.yon }}</button>
</div>
</div>
</div>
</sc-if>
<div style="display:flex;align-items:center;gap:10px">
<span style="flex:1;font:400 12px/1.35 var(--font-body);color:{{ ui.mut }}">{{ envKontrol.sayi }}</span>
<sc-if value="{{ envKontrol.suzuluyor }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ envKontrol.temizle }}" style="all:unset;box-sizing:border-box;cursor:pointer;border-radius:10px;border:1px solid {{ ui.rule }};color:{{ ui.mut }};font:600 11.5px/1 var(--font-body);letter-spacing:-.01em;padding:0 12px;min-height:36px;flex:1 0 auto;white-space:nowrap;justify-content:center;display:flex;align-items:center">Temizle</button>
</sc-if>
</div>
</div>
<sc-if value="{{ envKontrol.bosMu }}" hint-placeholder-val="{{ false }}">
<div style="padding:20px 14px;font:400 12.5px/1.5 var(--font-body);color:{{ ui.mut }}">{{ envKontrol.bosNot }}</div>
</sc-if>
<sc-for list="{{ list }}" as="a" hint-placeholder-count="7">
<button onClick="{{ a.tap }}" style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;width:100%;gap:12px;padding:13px 14px;border-bottom:1px solid {{ ui.rule }};align-items:flex-start;background:{{ a.rowBg }}">
<span style="flex:none;width:30px;height:30px;background:{{ a.fill }};border-radius:10px;border:1px solid {{ a.stroke }};color:{{ a.ink }};font:600 12.5px/1 var(--font-body);display:flex;align-items:center;justify-content:center">{{ a.glyph }}</span>
<span style="flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left">
<span style="font:600 14.5px/1.15 var(--font-heading);color:{{ ui.fg }}">{{ a.code }}</span>
<span style="font:400 12.5px/1.35 var(--font-body);color:{{ ui.mut }}">{{ a.metaPhone }}</span>
</span>
<span style="flex:none;display:flex;flex-direction:column;gap:4px;align-items:flex-end">
<span style="font:600 10.5px/1 var(--font-body);letter-spacing:-.01em;padding:4px 6px;background:{{ a.aBg }};color:{{ a.aFg }};border-radius:10px;border:1px solid {{ a.aBorder }}">{{ a.aLabel }}</span>
<sc-if value="{{ a.sVar }}" hint-placeholder-val="{{ false }}"><span style="font:600 10.5px/1 var(--font-body);letter-spacing:-.01em;padding:4px 6px;background:{{ a.sBg }};color:{{ a.sFg }};border-radius:10px;border:1px solid {{ a.sBorder }}">{{ a.sLabel }}</span></sc-if>
</span>
</button>
</sc-for>
</div>
</sc-if>
