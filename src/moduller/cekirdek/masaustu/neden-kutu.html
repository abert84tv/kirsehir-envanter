<sc-if value="{{ nedenKutu.var }}" hint-placeholder-val="{{ false }}">
<div style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:95;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box">
<div style="width:100%;max-width:420px;background:{{ ui.surf }};color:{{ ui.fg }};border-radius:16px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;box-sizing:border-box">
<span style="font:700 16px/1.3 var(--font-heading)">{{ nedenKutu.baslik }}</span>
<textarea value="{{ nedenKutu.deger }}" onInput="{{ nedenKutu.onDeger }}" onChange="{{ nedenKutu.onDeger }}" rows="3" placeholder="{{ nedenKutu.ipucu }}" style="all:unset;box-sizing:border-box;width:100%;min-height:84px;border-radius:12px;border:1px solid {{ ui.rule }};background:{{ ui.bg }};padding:12px;font:500 15px/1.4 var(--font-body);white-space:pre-wrap"></textarea>
<sc-if value="{{ nedenKutu.hataVar }}" hint-placeholder-val="{{ false }}"><span style="font:600 13px/1.3 var(--font-body);color:var(--color-uyari)">{{ nedenKutu.hata }}</span></sc-if>
<div style="display:flex;gap:10px">
<button onClick="{{ nedenKutu.iptal }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;min-height:48px;line-height:48px;border-radius:12px;border:1px solid {{ ui.rule }};font:600 15px/48px var(--font-body)">Vazgeç</button>
<button onClick="{{ nedenKutu.tamam }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;min-height:48px;border-radius:12px;background:var(--color-accent);color:#fff;font:700 15px/48px var(--font-body)">Tamam</button>
</div>
</div>
</div>
</sc-if>
