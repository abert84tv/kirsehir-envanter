<sc-if value="{{ ayar.cop }}" hint-placeholder-val="{{ false }}">
<div style="padding:13px 14px;border-bottom:1px solid {{ ui.rule }}">
<div style="font:600 10.5px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.acc }};margin-bottom:7px">Çöp kutusu</div>
<div style="font:400 12px/1.5 var(--font-body);color:{{ ui.mut }}">{{ trash.not }}</div>
<sc-if value="{{ trash.topluVar }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ trash.toplu }}" style="all:unset;box-sizing:border-box;cursor:pointer;width:100%;text-align:center;margin-top:10px;border-radius:10px;border:1px solid var(--color-accent);color:{{ ui.acc }};font:600 12px/1 var(--font-body);letter-spacing:-.01em;min-height:48px;display:flex;align-items:center;justify-content:center">{{ trash.topluEtiket }}</button>
</sc-if>
<sc-for list="{{ trash.rows }}" as="r" hint-placeholder-count="0">
<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid {{ ui.rule }};margin-top:8px">
<sc-if value="{{ r.onizlemeVar }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ r.buyut }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:54px;height:54px;border-radius:10px;border:1px solid {{ ui.rule }};overflow:hidden;display:block">
{{ r.onizlemeEl }}
</button>
</sc-if>
<span style="flex:1;display:flex;flex-direction:column;gap:3px;min-width:0">
<span style="font:600 13px/1.15 var(--font-heading);color:{{ ui.fg }}">{{ r.code }} · {{ r.kind }}</span>
<span style="font:400 11.5px/1.4 var(--font-body);color:{{ ui.mut }}">{{ r.place }} — {{ r.meta }}</span>
<span style="font:400 11px/1.3 ui-monospace,Menlo,monospace;color:{{ ui.mut }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ r.dosyaAd }}</span>
<sc-if value="{{ r.sesVar }}" hint-placeholder-val="{{ false }}">
<span style="display:block;margin-top:4px">{{ r.sesEl }}</span>
</sc-if>
</span>
<div style="display:flex;flex-direction:column;gap:6px;flex:none">
<button onClick="{{ r.geri }}" style="all:unset;box-sizing:border-box;cursor:pointer;text-align:center;border-radius:10px;border:1px solid var(--color-accent);color:{{ ui.acc }};font:600 11px/1 var(--font-body);letter-spacing:-.01em;padding:12px;min-height:44px">Geri getir</button>
<sc-if value="{{ r.kaliciVar }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ r.kalici }}" style="all:unset;box-sizing:border-box;cursor:pointer;text-align:center;border-radius:10px;border:1px solid {{ ui.rule }};color:{{ ui.mut }};font:600 11px/1 var(--font-body);letter-spacing:-.01em;padding:12px;min-height:44px">Kalıcı sil</button>
</sc-if>
</div>
</div>
</sc-for>
</div>
</sc-if>
