<!-- ══════════════ GİRİŞ ══════════════ -->
<sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
<div style="min-height:100dvh;box-sizing:border-box;padding:24px;display:flex;align-items:center;justify-content:center">
<div style="width:452px;max-width:100%;border-radius:18px;border:1px solid var(--color-divider);background:var(--color-surface);box-shadow:var(--shadow-md);overflow:hidden">
<div style="padding:26px 24px 22px">
<div style="width:26px;height:26px;background:var(--color-accent);margin-bottom:18px"></div>
<div style="font:600 11px/1 var(--font-body);letter-spacing:-.01em;color:var(--color-accent);margin-bottom:9px">Kullanıcı girişi</div>
<h1 style="font:600 25px/1.06 var(--font-heading);letter-spacing:-.022em;letter-spacing:-.01em;margin:0 0 18px">Kırsal Altyapı ve Su Şebekesi Envanteri</h1>
<div style="display:flex;flex-direction:column;gap:13px">
<label style="display:flex;flex-direction:column;gap:6px">
<span style="font:600 11px/1 var(--font-body);letter-spacing:-.01em;color:var(--color-neutral-600)">Kullanıcı adı</span>
<input value="{{ loginForm.user }}" onChange="{{ loginForm.onUser }}" onKeyDown="{{ loginForm.onKey }}" autocomplete="username" placeholder="ad.soyad" style="all:unset;border-radius:10px;border:1px solid var(--color-text);padding:13px 12px;font:600 15px/1 var(--font-body);color:var(--color-text);background:#fff">
</label>
<label style="display:flex;flex-direction:column;gap:6px">
<span style="font:600 11px/1 var(--font-body);letter-spacing:-.01em;color:var(--color-neutral-600)">Şifre</span>
<input value="{{ loginForm.pw }}" onChange="{{ loginForm.onPw }}" onKeyDown="{{ loginForm.onKey }}" type="password" autocomplete="current-password" placeholder="••••" style="all:unset;border-radius:10px;border:1px solid var(--color-text);padding:13px 12px;font:600 15px/1 ui-monospace,Menlo,monospace;letter-spacing:-.01em;color:var(--color-text);background:#fff">
</label>
<sc-if value="{{ loginForm.hasErr }}" hint-placeholder-val="{{ false }}">
<div style="border-radius:10px;border:1px solid var(--color-uyari-200);background:var(--color-uyari-100);color:var(--color-uyari-700);padding:10px 12px;font:600 12.5px/1.35 var(--font-body)">{{ loginForm.err }}</div>
</sc-if>
<sc-if value="{{ loginForm.dolu }}" hint-placeholder-val="{{ false }}">
<div style="border-radius:10px;border:1px solid var(--color-divider);background:var(--color-neutral-200);padding:11px 13px;display:flex;align-items:center;gap:12px">
<span style="flex:1;font:400 12px/1.45 var(--font-body);color:var(--color-neutral-700)">Bu cihazda kayıtlı giriş dolduruldu — <strong style="color:var(--color-text)">Giriş yap</strong>'a basmanız yeterli.</span>
<button onClick="{{ loginForm.temizle }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;white-space:nowrap;border-radius:10px;border:1px solid var(--color-neutral-600);color:var(--color-neutral-700);font:600 11px/1 var(--font-body);letter-spacing:-.01em;padding:10px 12px" style-hover="border-color:var(--color-accent);color:var(--color-accent)">Başka hesap</button>
</div>
</sc-if>
<button onClick="{{ loginForm.toggleRemember }}" style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:flex-start;gap:10px;padding:4px 0;text-align:left">
<span style="flex:none;font:700 18px/1 var(--font-body);color:var(--color-accent);width:18px">{{ loginForm.rememberMark }}</span>
<span style="display:flex;flex-direction:column;gap:3px">
<span style="font:600 13px/1 var(--font-body);color:var(--color-text)">Beni hatırla</span>
<span style="font:400 12px/1.4 var(--font-body);color:var(--color-neutral-600)">{{ loginForm.rememberNote }}</span>
</span>
</button>
</div>
</div>
<div style="border-top:1px solid var(--color-text);background:var(--color-neutral-200);padding:14px 24px;display:flex;align-items:center;justify-content:flex-end">
<button onClick="{{ login }}" class="btn btn-primary" style="border:none;cursor:pointer;font:600 14px/1 var(--font-body);padding:15px 22px;justify-content:center;flex:none">Giriş yap</button>
</div>
</div>
</div>
</sc-if>
