<!-- main -->
<div style="flex:1;min-width:0;display:flex;flex-direction:column">
<div style="flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;height:58px;border-bottom:1px solid {{ ui.rule }};background:{{ ui.surf }};overflow:hidden">
<sc-if value="{{ geziGeri.var }}" hint-placeholder-val="{{ false }}"><button onClick="{{ geziGeri.git }}" title="Önceki sayfaya dön" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 10px;border-radius:10px;border:1px solid {{ ui.rule }};background:{{ ui.surf2 }};color:{{ ui.acc }};font:600 13px/1 var(--font-body)"><span style="font-size:18px;line-height:1;margin-top:-1px">‹</span>{{ geziGeri.ad }}</button></sc-if>
<div style="flex:1 1 140px;min-width:110px;display:flex;flex-direction:column;gap:3px">
<span style="font:700 17px/1.15 var(--font-heading);letter-spacing:-.022em;color:{{ ui.fg }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ ustBar.baslik }}</span>
<span class="ks-bilgi" style="font:400 12px/1.2 var(--font-body);color:{{ ui.mut }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ ustBar.alt }}</span>
</div>
<sc-if value="{{ tab.envanter }}" hint-placeholder-val="{{ false }}">
<span style="flex:none;font:600 12.5px/1 var(--font-body);color:{{ ui.fg }}">{{ envKontrol.sayi }}</span>
</sc-if>
<div style="flex:none;display:flex;border-radius:10px;overflow:hidden">
<sc-if value="{{ kuyrukG.var }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ kuyrukG.git }}" title="{{ kuyrukG.not }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;white-space:nowrap;height:34px;padding:0 12px;border-radius:0;background:var(--color-uyari);color:#fff;font:600 12px/34px var(--font-body);letter-spacing:-.01em" style-hover="opacity:.88">{{ kuyrukG.label }}</button>
</sc-if>
<button onClick="{{ toggleNet }}" title="{{ net.ipucu }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;white-space:nowrap;height:34px;padding:0 12px;border-radius:0;display:flex;align-items:center;gap:8px;font:600 12px/1 var(--font-body);letter-spacing:-.01em;color:{{ net.yazi }};background:{{ net.zemin }}"><span class="ks-canli {{ net.nokta }}"></span>{{ net.badge }}</button>
</div>
<button onClick="{{ masaMenu.ac }}" title="Yenile, koordinat dönüşümü, tema, yardım, çıkış" aria-label="Menü" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:34px;height:34px;border-radius:10px;border:1px solid {{ masaMenu.kenar }};background:{{ masaMenu.zemin }};color:{{ masaMenu.yazi }};display:flex;align-items:center;justify-content:center;font:700 18px/1 var(--font-body)">⋮</button>
<sc-if value="{{ naAcVar }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ naAc }}" title="Yeni tesis kaydı aç" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;white-space:nowrap;height:34px;padding:0 14px;border-radius:10px;background:var(--color-accent);color:#fff;font:600 12.5px/34px var(--font-body);letter-spacing:-.01em" style-hover="background:var(--color-accent-600)">+<span class="ks-ust-etiket"> Yeni tesis</span></button>
</sc-if>
</div>
<sc-if value="{{ masaMenu.acik }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ masaMenu.kapat }}" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:300"></div>
<div class="ks-gir" style="position:absolute;right:20px;top:56px;z-index:301;min-width:250px;border-radius:14px;border:1px solid {{ ui.rule }};background:{{ ui.surf }};box-shadow:0 18px 44px rgba(0,0,0,.24);padding:6px;display:flex;flex-direction:column">
<sc-for list="{{ masaMenu.ogeler }}" as="o" hint-placeholder-count="5">
<button onClick="{{ o.git }}" style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border-radius:9px;font:600 13.5px/1 var(--font-body);color:{{ o.renk }}" style-hover="background:{{ ui.surf2 }}"><span style="width:20px;text-align:center;font-size:15px">{{ o.ikon }}</span>{{ o.ad }}</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ naSz.haritada }}" hint-placeholder-val="{{ false }}">
<div class="ks-gir" style="position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:12px;background:rgba(29,29,31,.94);color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.25);font:600 13px/1.3 var(--font-body)">
<span class="ks-canli"></span>
<span>Yeni tesis: haritada tesisin yerine çift tıklayın</span>
<button onClick="{{ naSz.haritaVazgec }}" style="all:unset;box-sizing:border-box;cursor:pointer;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.14);font:600 12px/1 var(--font-body)">Forma dön</button>
</div>
</sc-if>

<!--@dahil moduller/envanter/masaustu/naSz-acik.html-->

<sc-if value="{{ hasSuggest }}" hint-placeholder-val="{{ false }}">
<div class="scroll ks-gir" style="position:absolute;top:100px;left:12px;width:480px;max-width:calc(100% - 40px);z-index:64;border:1px solid {{ ui.rule }};border-radius:12px;background:{{ ui.surf }};box-shadow:0 12px 34px rgba(0,0,0,.16);max-height:320px;overflow:auto;padding:4px">
<sc-for list="{{ suggestions }}" as="s" hint-placeholder-count="3">
<button onClick="{{ s.go }}" style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;padding:9px 12px;border-radius:9px" style-hover="background:{{ ui.surf2 }}">
<span style="font:600 10.5px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.acc }};width:78px;flex:none">{{ s.kind }}</span>
<span style="font:600 13.5px/1 var(--font-body)">{{ s.name }}</span>
<span style="font:400 12.5px/1 var(--font-body);color:{{ ui.mut }}">{{ s.meta }}</span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ saltOkur }}" hint-placeholder-val="{{ false }}">
<div style="flex:none;padding:9px 20px;border-bottom:1px solid var(--color-uyari-200);background:var(--color-uyari-100);font:600 12px/1.45 var(--font-body);color:var(--color-uyari-800)">{{ saltOkurNot }}</div>
</sc-if>

<!-- Sayfa süzgeç çubuğu — başlık artık üst çubukta; burada yalnız süzgeçler -->
<sc-if value="{{ sayfaBar.acik }}" hint-placeholder-val="{{ false }}">
<div style="flex:none;display:flex;align-items:center;gap:16px;padding:8px 20px;border-bottom:1px solid {{ ui.rule }};background:{{ ui.surf }}">
<div style="flex:none;display:flex;width:fit-content;gap:2px;padding:2px;border-radius:11px;background:{{ ui.surf2 }}">
<sc-for list="{{ sayfaBar.suzgecler }}" as="z" hint-placeholder-count="4">
<button onClick="{{ z.pick }}" style="all:unset;box-sizing:border-box;cursor:pointer;min-height:32px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 14px;border-radius:9px;background:{{ z.bg }};color:{{ z.fg }};box-shadow:{{ z.golge }};font:600 13.5px/1 var(--font-body);letter-spacing:-.012em">
<span>{{ z.label }}</span>
<sc-if value="{{ z.nVar }}" hint-placeholder-val="{{ false }}">
<span style="font:600 11px/1 var(--font-body);opacity:.75">{{ z.n }}</span>
</sc-if>
</button>
</sc-for>
</div>
</div>
</sc-if>

<div style="flex:1;position:relative;min-width:0;min-height:0;display:{{ map.display }};flex-direction:column">
<iframe src="harita.html" title="Kırşehir haritası" style="flex:1;width:100%;border:none;display:block;background:{{ ui.bg }}"></iframe>
<div style="position:absolute;right:18px;bottom:20px;z-index:5;display:flex;flex-direction:column;gap:8px;align-items:flex-end">
<sc-if value="{{ newFaultVar }}" hint-placeholder-val="{{ true }}"><button onClick="{{ newFault }}" title="Yeni arıza bildir" style="all:unset;box-sizing:border-box;cursor:pointer;width:42px;height:42px;background:{{ ui.surf }};border-radius:12px;border:1px solid {{ ui.rule }};box-shadow:0 2px 8px rgba(0,0,0,.18);color:var(--color-accent);display:{{ map.arizaBtn }};align-items:center;justify-content:center" style-hover="background:rgba(0,113,227,.14);border-color:var(--color-accent)">{{ ikonlar.ariza }}</button></sc-if>
<button onClick="{{ goToMyLocation }}" aria-label="Konumuma git" title="Konumuma git" style="all:unset;box-sizing:border-box;cursor:pointer;width:42px;height:42px;background:{{ ui.surf }};border-radius:12px;border:1px solid {{ ui.rule }};box-shadow:0 2px 8px rgba(0,0,0,.18);color:var(--color-accent);display:flex;align-items:center;justify-content:center" style-hover="background:rgba(0,113,227,.14);border-color:var(--color-accent)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.4"/><circle cx="12" cy="12" r="7.6" opacity=".9"/><path d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3"/></svg></button>
</div>
</div>
