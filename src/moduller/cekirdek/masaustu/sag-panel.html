<!-- right panel -->
<sc-if value="{{ panel.any }}" hint-placeholder-val="{{ true }}">
<div class="scroll" style="width:392px;flex:0 1 392px;min-width:0;border-left:1px solid {{ ui.rule }};background:{{ ui.surf }};display:flex;flex-direction:column;overflow:auto">
<div style="position:sticky;top:0;z-index:20;height:0;flex:none">
<button onClick="{{ panelKapat }}" title="Kapat — Esc" aria-label="Paneli kapat" style="all:unset;box-sizing:border-box;cursor:pointer;position:absolute;top:12px;right:14px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:11px;border:1px solid {{ ui.rule }};background:{{ ui.surf }};color:{{ ui.fg }};box-shadow:0 2px 10px rgba(0,0,0,.2)" style-hover="border-color:var(--color-accent);color:var(--color-accent)">{{ ikonlar.kapat }}</button>
</div>

<!--@dahil moduller/envanter/masaustu/panel-isDetail.html-->

<!--@dahil moduller/ariza/masaustu/panel-isFault.html-->

<!--@dahil moduller/harita/masaustu/panel-isConv.html-->

</div>
</sc-if>
</div>

<div style="flex:none;height:34px;display:flex;align-items:center;gap:16px;padding:0 18px;border-top:1px solid {{ ui.rule }};background:{{ status.bg }};color:{{ status.fg }};font:600 12px/1 var(--font-body);letter-spacing:-.01em">
<span>{{ status.text }}</span>
<span style="flex:1"></span>
<span style="color:{{ status.mut }}">{{ status.right }}</span>
</div>

</div>
</sc-if>
