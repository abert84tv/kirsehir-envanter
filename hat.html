<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hat güzergâhları — Kırşehir envanter</title>
<link rel="stylesheet" href="_ds/modernist-803f2872-3d47-4f54-a490-6b99844264cd/styles.css">
<style id="ks-tema">
/* Arayüz yenilemesi — ana pencereyle aynı belirteçler.
   Tasarım sisteminin kırmızı vurgusu maviye çevrildi; kırmızı yalnız uyarı. */
:root{
 --font-heading:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 --color-bg:#f5f5f7;--color-text:#1d1d1f;--color-divider:rgba(0,0,0,.09);--color-surface:#ffffff;
 --color-neutral-100:#fbfbfd;--color-neutral-200:#f0f0f3;--color-neutral-300:#e4e4e9;
 --color-neutral-400:#c9c9ce;--color-neutral-500:#aeaeb2;--color-neutral-600:#6e6e73;
 --color-neutral-700:#48484a;--color-neutral-800:#2c2c2e;--color-neutral-900:#1d1d1f;
 --color-accent:#0071e3;--color-accent-100:#eef5ff;--color-accent-200:#d9e9ff;
 --color-accent-300:#aecfff;--color-accent-400:#5aa9ff;--color-accent-500:#0071e3;
 --color-accent-600:#0062c6;--color-accent-700:#0a57a8;--color-accent-800:#0a4382;--color-accent-900:#093362;
 --color-uyari:#d70015;
 --radius-md:12px;--radius-sm:9px;--radius-lg:18px;
 --shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow-md:0 4px 18px rgba(0,0,0,.07);--shadow-lg:0 18px 48px rgba(0,0,0,.14);
}
body{-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
</style>

<link rel="stylesheet" href="./vendor/leaflet.css">
<script src="./vendor/leaflet.js"></script>
<link rel="stylesheet" href="harita-ortak.css">
<style>
  html,body{margin:0;height:100%;font-family:var(--font-body);background:var(--color-bg);color:var(--color-text)}
  /* Harita tüm alanı kaplar; araçlar üstünde yüzer (2026.10.05: kenar paneli
     haritayı küçültüyordu, telefonda çizim alanı kalmıyordu) */
  #wrap{position:absolute;inset:0}
  #map{position:absolute;inset:0}
  .leaflet-container{background:#e8e8ed;font-family:var(--font-body)}
  button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
    min-height:44px;min-width:44px;border-radius:11px;color:var(--color-text);font:600 12px/1 var(--font-body);letter-spacing:-.01em}
  button:hover{background:var(--color-neutral-200)}
  button.on{background:var(--color-accent);color:#fff}
  button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
  button[disabled]{opacity:.35;cursor:default;pointer-events:none}
  button svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .yuz{position:absolute;z-index:900;background:color-mix(in srgb,var(--color-surface) 93%,transparent);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--color-divider);
    border-radius:15px;box-shadow:var(--shadow-md)}
  #bar{top:10px;left:10px;display:flex;align-items:center;gap:2px;padding:4px;max-width:calc(100% - 20px)}
  #bar .ayr{flex:none;width:1px;height:22px;background:var(--color-divider);margin:0 3px}
  #bar .ttl{font:700 12.5px/1 var(--font-heading);padding:0 10px 0 8px;white-space:nowrap}
  #bar button.metin{padding:0 12px}
  #durum{top:68px;left:10px;max-width:calc(100% - 20px);padding:8px 12px;font:600 12px/1.35 var(--font-body)}
  #durum:empty{display:none}
  #alt{left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:6px;padding:5px;
    max-width:calc(100% - 20px)}
  #turler{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  #turler::-webkit-scrollbar{display:none}
  .tur{flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:11px;cursor:pointer;
    min-height:44px;border:1.5px solid transparent}
  .tur.on{background:var(--color-neutral-200);border-color:var(--color-accent)}
  .tur i{flex:none;width:18px;height:0;border-top-width:4px;border-top-style:solid;border-radius:2px}
  .tur span{font:600 12.5px/1.2 var(--font-body);white-space:nowrap}
  #hatlarAc{flex:none;padding:0 12px}
  #hatlarAc b{font:700 12.5px/1 ui-monospace,Menlo,monospace;color:var(--color-accent)}
  #panel{right:10px;bottom:68px;width:min(340px,calc(100% - 20px));max-height:calc(100% - 150px);overflow:auto;padding:6px 14px 10px;display:none}
  #panel.acik{display:block}
  .hat{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--color-divider)}
  .hat:last-of-type{border-bottom:none}
  .hat i{flex:none;width:20px;height:0;border-top-width:4px;border-top-style:solid}
  .hat .ad{flex:1;min-width:0;font:600 13px/1.3 var(--font-body)}
  .hat .uz{flex:none;font:600 13px/1 ui-monospace,Menlo,monospace;color:var(--color-accent)}
  .hat button{padding:0 10px;min-height:38px;min-width:0;font-size:11.5px;border:1px solid var(--color-divider)}
  .note{font:400 12.5px/1.5 var(--font-body);color:var(--color-neutral-600);padding:8px 0}
  .toplam{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px;padding-top:8px;border-top:1px solid var(--color-divider)}
  .toplam b{font:700 20px/1 var(--font-heading);color:var(--color-accent)}
  .toplam span{font:600 11.5px/1.3 var(--font-body);color:var(--color-neutral-600)}
  .leaflet-top.leaflet-right{margin-top:4px}
  .leaflet-bottom.leaflet-right{margin-bottom:64px}
  .ks-uc{width:12px;height:12px;border:1px solid var(--color-divider);border-radius:9px;background:#fff}
  .ks-tesis{display:flex;align-items:center;justify-content:center;width:26px;height:26px;
    border:2px solid var(--color-accent);background:var(--color-accent);color:#fff;
    font:600 12.5px/1 var(--font-body)}
  .ks-uzun{background:var(--color-text);border:1px solid var(--color-divider);border-radius:9px;color:#fff;padding:1px 5px;
    font:600 11px/1.3 var(--font-body)}
  .ks-uzun:before{display:none}
  @media (max-width:760px){ #bar .ttl{display:none} #durum{top:66px} }
  /* Koyu tema — ana pencereyle aynı gerçek-siyah palet (bkz. index.html th()).
     Neredeyse her kural var(--color-*) kullandığı için yalnızca değişkenleri
     devretmek yetiyor; sabit #fff kullanan .ks-uc ve var(--color-text) üstüne
     beyaz yazı basan .ks-uzun ayrıca düzeltilir. */
  body.dark{
    --color-bg:#121214;--color-text:#f5f5f7;--color-divider:rgba(255,255,255,.13);--color-surface:#1c1c1e;
    --color-neutral-100:#1c1c1e;--color-neutral-200:#2c2c2e;--color-neutral-300:#3a3a3c;
    --color-neutral-400:#48484a;--color-neutral-500:#6e6e73;--color-neutral-600:rgba(235,235,245,.62);
    --color-neutral-700:#aeaeb2;--color-neutral-800:#d1d1d6;--color-neutral-900:#f5f5f7;
    --color-accent:#0a84ff;--color-accent-600:#409cff;
  }
  body.dark .leaflet-container{background:#1c1c1e}
  /* .ks-tiles/.ks-sat karo kısma değerleri artık harita-ortak.css'te */
  body.dark .ks-uc{background:#1c1c1e}
  body.dark .ks-uzun{background:#3a3a3c}
</style>
</head>
<body>
<div id="wrap">
  <div id="map"></div>
  <div id="bar" class="yuz">
    <span class="ttl" id="kodBas">Hatlar</span>
    <button id="ciz" class="metin" title="Yeni hat çiz" aria-label="Yeni hat çiz"><svg viewBox="0 0 24 24"><path d="M4 19l5-9 5 5 6-9"/></svg><span class="l">Çiz</span></button>
    <button id="bitir" disabled title="Hattı bitir" aria-label="Hattı bitir"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <button id="geri" disabled title="Son noktayı sil" aria-label="Son noktayı sil"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="vaz" disabled title="Vazgeç" aria-label="Vazgeç"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <span class="ayr"></span>
    <button id="disaAl" title="KML/KMZ içe aktar" aria-label="KML/KMZ içe aktar"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg></button>
    <button id="zemin" title="Uydu / sokak" aria-label="Uydu / sokak"><svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
  </div>
  <div id="durum" class="yuz"></div>
  <div id="panel" class="yuz">
    <div id="liste"><div class="note">Hat yok.</div></div>
    <div class="toplam"><span>Toplam</span><b id="toplam">—</b></div>
  </div>
  <div id="alt" class="yuz">
    <div id="turler"></div>
    <button id="hatlarAc" title="Bu kayda bağlı hatlar" aria-label="Hatlar"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg><b id="toplamK">—</b></button>
  </div>
</div>
<script>
// Renkler bilerek renk çemberine yayıldı — birbirine yakın iki hat türü
// karışmasın diye (önceki sürümde terfi/AG ikisi de mavi, DC/kolektör
// ikisi de kahverengiydi, haritada ayırt edilemiyordu).
const TURLER = [
  ['terfi', 'Terfi hattı', '#0071e3', 'Kuyu → depo, pompayla basılan'],
  ['isale', 'İsale hattı', '#201e1d', 'Depo → köy, cazibeli'],
  ['sebeke', 'Şebeke hattı', '#8a8580', 'Köy içi dağıtım'],
  ['ag', 'AG enerji hattı', '#e2711d', 'Trafo → pano, alçak gerilim'],
  ['og', 'OG enerji hattı', '#7b3fbf', 'Orta gerilim, direkli'],
  ['dc', 'GES DC hattı', '#b6a000', 'Panel → invertör'],
  ['kolektor', 'Kolektör hattı', '#1f8a5f', 'Kanalizasyon toplayıcı, NetCAD projesinden']
];
const REN = Object.fromEntries(TURLER.map(t => [t[0], t[2]]));
const AD = Object.fromEntries(TURLER.map(t => [t[0], t[1]]));

const el = id => document.getElementById(id);
const map = L.map('map', { zoomControl: false }).setView([39.15091, 34.15952], 13);
L.control.zoom({ position: 'topright' }).addTo(map);
const sokak = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 19, attribution: '© OpenStreetMap', className: 'ks-tiles' }).addTo(map);
const uydu = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 19, attribution: 'Esri, Maxar', className: 'ks-sat' });
let uyduAcik = false;

let tesis = null, hatlar = [], tur = 'terfi', cizim = null, yazma = true;
const kat = L.layerGroup().addTo(map);
let cizKat = L.layerGroup().addTo(map);

const rad = d => d * Math.PI / 180;
function mesafe(a, b) {
  const R = 6371008.8, dLat = rad(b[0] - a[0]), dLon = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}
const uzunluk = n => n.reduce((t, p, i) => i ? t + mesafe(n[i - 1], p) : 0, 0);
const km = m => m >= 1000 ? (m / 1000).toFixed(m < 10000 ? 2 : 1) + ' km' : Math.round(m) + ' m';

function turleriCiz() {
  el('turler').innerHTML = '';
  for (const [k, ad, renk, aciklama] of TURLER) {
    const d = document.createElement('div');
    d.className = 'tur' + (tur === k ? ' on' : '');
    d.innerHTML = '<i style="border-top-color:' + renk + '"></i><span>' + ad.replace(' hattı', '') + '</span>';
    d.title = ad + ' — ' + aciklama;
    d.onclick = () => { tur = k; turleriCiz(); if (cizim) cizimYenile(); };
    el('turler').appendChild(d);
  }
}
function listeCiz() {
  const k = el('liste');
  if (!hatlar.length) { k.innerHTML = '<div class="note">Hat yok.</div>'; el('toplam').textContent = '—'; el('toplamK').textContent = '—'; return; }
  k.innerHTML = '';
  hatlar.forEach((ht, i) => {
    const r = document.createElement('div'); r.className = 'hat';
    r.innerHTML = '<i style="border-top-color:' + (REN[ht.tur] || '#201e1d') + '"></i>'
      + '<span class="ad">' + (AD[ht.tur] || ht.tur) + '<br><span style="font:400 9.5px/1.3 var(--font-body);color:var(--color-neutral-600)">'
      + ht.noktalar.length + ' nokta' + (ht.cap ? ' · Ø' + ht.cap + ' mm' : '') + (ht.malzeme ? ' · ' + ht.malzeme : '') + '</span></span>'
      + '<span class="uz">' + km(uzunluk(ht.noktalar)) + '</span>';
    const g = document.createElement('button'); g.textContent = 'Göster';
    g.onclick = () => map.fitBounds(L.latLngBounds(ht.noktalar).pad(.3));
    r.appendChild(g);
    if (yazma) {
      const c = document.createElement('button'); c.textContent = 'Çap';
      c.onclick = () => {
        const v = prompt('Boru çapı (mm) — boş bırakırsanız silinir', ht.cap || '');
        if (v === null) return;
        const n = parseInt(String(v).replace(/[^0-9]/g, ''), 10);
        ht.cap = n > 0 ? n : '';
        const m = prompt('Boru malzemesi (PE100, PVC, Çelik, Düktil, AC, Galvaniz…)', ht.malzeme || '');
        if (m !== null) ht.malzeme = m.trim().slice(0, 20);
        ciz(); gonder();
      };
      r.appendChild(c);
      const x = document.createElement('button'); x.textContent = 'Sil';
      x.onclick = () => { hatlar.splice(i, 1); ciz(); gonder(); };
      r.appendChild(x);
    }
    k.appendChild(r);
  });
  el('toplam').textContent = km(hatlar.reduce((t, ht) => t + uzunluk(ht.noktalar), 0));
  el('toplamK').textContent = el('toplam').textContent;
}
function ciz() {
  kat.clearLayers();
  if (tesis) {
    L.marker([tesis.lat, tesis.lon], {
      icon: L.divIcon({ className: '', iconSize: [26, 26], iconAnchor: [13, 13], html: '<div class="ks-tesis">◆</div>' }),
      zIndexOffset: 500
    }).bindTooltip(tesis.kod || 'Kayıt', { direction: 'top' }).addTo(kat);
  }
  hatlar.forEach((ht, i) => {
    const renk = REN[ht.tur] || '#201e1d';
    L.polyline(ht.noktalar, { color: renk, weight: 5, opacity: .95 })
      .bindTooltip((AD[ht.tur] || ht.tur) + ' · ' + km(uzunluk(ht.noktalar)), { sticky: true })
      .addTo(kat);
    // uçlar sürüklenebilir: güzergâh sonradan düzeltilebilir
    if (yazma) ht.noktalar.forEach((p, k) => {
      const mk = L.marker(p, {
        icon: L.divIcon({ className: '', iconSize: [12, 12], iconAnchor: [6, 6], html: '<div class="ks-uc"></div>' }),
        draggable: true
      });
      mk.on('drag', e => { const ll = e.target.getLatLng(); hatlar[i].noktalar[k] = [ll.lat, ll.lng]; });
      mk.on('dragend', () => { ciz(); listeCiz(); gonder(); });
      mk.addTo(kat);
    });
    const orta = ht.noktalar[Math.floor(ht.noktalar.length / 2)];
    if (orta) L.tooltip({ permanent: true, direction: 'center', className: 'ks-uzun' })
      .setLatLng(orta).setContent(km(uzunluk(ht.noktalar))).addTo(kat);
  });
  listeCiz();
}
function cizimYenile() {
  cizKat.clearLayers();
  if (!cizim || cizim.length < 1) return;
  const renk = REN[tur] || '#201e1d';
  if (cizim.length > 1) L.polyline(cizim, { color: renk, weight: 5, dashArray: '8 6' }).addTo(cizKat);
  cizim.forEach(p => L.marker(p, {
    icon: L.divIcon({ className: '', iconSize: [12, 12], iconAnchor: [6, 6], html: '<div class="ks-uc"></div>' }),
    interactive: false
  }).addTo(cizKat));
  el('durum').textContent = cizim.length < 2
    ? AD[tur] + ' · haritaya dokunarak sürdürün'
    : AD[tur] + ' · ' + cizim.length + ' nokta · ' + km(uzunluk(cizim));
}
function dugmeler() {
  const c = !!cizim;
  el('ciz').classList.toggle('on', c);
  el('ciz').querySelector('.l').textContent = c ? 'Çiziliyor' : 'Çiz';
  el('bitir').disabled = !c || cizim.length < 2;
  el('geri').disabled = !c || !cizim.length;
  el('vaz').disabled = !c;
  el('ciz').disabled = !yazma;
  el('disaAl').disabled = !yazma;
}
// .kmz bir ZIP arşividir (genelde tek bir doc.kml içerir). Kütüphane
// eklemeden, merkezi dizini elle okuyup deflate akışını tarayıcının
// kendi DecompressionStream'iyle açıyoruz — proje boyunca dışarıdan
// bağımlılık eklenmemesi kuralına uyar (bkz. README "Teknik yapı").
async function kmzAc(dosya) {
  const buf = new Uint8Array(await dosya.arrayBuffer());
  const dv = new DataView(buf.buffer);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 22 - 65536); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('ZIP sonu bulunamadı — bozuk .kmz dosyası.');
  const girisSayisi = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  for (let i = 0; i < girisSayisi; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const sikistirma = dv.getUint16(p + 10, true);
    const sikBoyut = dv.getUint32(p + 20, true);
    const adUzunluk = dv.getUint16(p + 28, true);
    const ekUzunluk = dv.getUint16(p + 30, true);
    const yorumUzunluk = dv.getUint16(p + 32, true);
    const yerelOfset = dv.getUint32(p + 42, true);
    const ad = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + adUzunluk));
    if (/\.kml$/i.test(ad)) {
      const lAdUzunluk = dv.getUint16(yerelOfset + 26, true);
      const lEkUzunluk = dv.getUint16(yerelOfset + 28, true);
      const veriOfset = yerelOfset + 30 + lAdUzunluk + lEkUzunluk;
      const veri = buf.subarray(veriOfset, veriOfset + sikBoyut);
      let acik;
      if (sikistirma === 0) acik = veri;
      else if (sikistirma === 8) {
        const ds = new DecompressionStream('deflate-raw');
        const yazici = ds.writable.getWriter();
        yazici.write(veri); yazici.close();
        acik = new Uint8Array(await new Response(ds.readable).arrayBuffer());
      } else throw new Error('Desteklenmeyen sıkıştırma yöntemi (' + sikistirma + ') — .kmz standart dışı.');
      return new TextDecoder('utf-8').decode(acik);
    }
    p += 46 + adUzunluk + ekUzunluk + yorumUzunluk;
  }
  throw new Error('.kmz içinde .kml dosyası bulunamadı.');
}
// KML'deki <coordinates> sırası lon,lat,yükseklik — Leaflet [lat,lon] bekler
function kmlIsle(metin) {
  const doc = new DOMParser().parseFromString(metin, 'text/xml');
  if (doc.querySelector('parsererror')) throw new Error('KML dosyası okunamadı — biçim bozuk.');
  const cizgiler = [];
  doc.querySelectorAll('LineString > coordinates, LinearRing > coordinates').forEach(c => {
    const noktalar = (c.textContent || '').trim().split(/\s+/).map(t => {
      const parca = t.split(',');
      const lon = parseFloat(parca[0]), lat = parseFloat(parca[1]);
      return [lat, lon];
    }).filter(pt => isFinite(pt[0]) && isFinite(pt[1]));
    if (noktalar.length >= 2) cizgiler.push(noktalar);
  });
  return cizgiler;
}
el('disaAl').onclick = () => {
  if (!yazma) return;
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.kml,.kmz';
  inp.style.display = 'none';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    inp.remove();
    if (!f) return;
    el('durum').textContent = 'Okunuyor…';
    try {
      const metin = /\.kmz$/i.test(f.name) ? await kmzAc(f) : await f.text();
      const cizgiler = kmlIsle(metin);
      if (!cizgiler.length) { el('durum').textContent = 'Dosyada çizgi yok'; return; }
      cizgiler.forEach((noktalar, i) => hatlar.push({ id: 'h' + Date.now() + i, tur, noktalar }));
      ciz(); dugmeler(); gonder();
      el('durum').textContent = cizgiler.length + ' güzergâh içe aktarıldı (' + AD[tur] + ')';
    } catch (e) {
      el('durum').textContent = f.name + ' içe aktarılamadı: ' + e.message;
    }
  };
  document.body.appendChild(inp);
  inp.click();
};
map.on('click', e => {
  if (!cizim || !yazma) return;
  cizim.push([e.latlng.lat, e.latlng.lng]);
  cizimYenile(); dugmeler();
});
el('ciz').onclick = () => {
  if (!yazma) return;
  cizim = [];
  if (tesis) cizim.push([tesis.lat, tesis.lon]);
  cizimYenile(); dugmeler();
  el('durum').textContent = AD[tur] + ' · haritaya dokunun';
};
el('geri').onclick = () => { if (cizim) { cizim.pop(); cizimYenile(); dugmeler(); } };
el('vaz').onclick = () => {
  cizim = null; cizKat.clearLayers(); dugmeler();
  el('durum').textContent = '';
};
el('bitir').onclick = () => {
  if (!cizim || cizim.length < 2) return;
  hatlar.push({ id: 'h' + Date.now(), tur, noktalar: cizim.slice() });
  cizim = null; cizKat.clearLayers();
  ciz(); dugmeler(); gonder();
  el('durum').textContent = AD[tur] + ' eklendi';
};
el('zemin').onclick = () => {
  uyduAcik = !uyduAcik;
  el('zemin').classList.toggle('on', uyduAcik);
  if (uyduAcik) { map.removeLayer(sokak); uydu.addTo(map); } else { map.removeLayer(uydu); sokak.addTo(map); }
};
function gonder() {
  try {
    parent.postMessage({ ks: 'hatlar', kod: tesis ? tesis.kod : '', id: tesis ? tesis.id : '', hatlar }, '*');
  } catch (e) { /* çerçeve yok */ }
}
window.addEventListener('message', ev => {
  const d = ev.data;
  if (!d) return;
  if (d.ks === 'theme') { document.body.classList.toggle('dark', d.dark); return; }
  if (d.ks !== 'hat') return;
  tesis = d.tesis || null;
  hatlar = Array.isArray(d.hatlar) ? d.hatlar.map(h => ({ ...h, noktalar: (h.noktalar || []).map(p => [+p[0], +p[1]]) })) : [];
  yazma = d.yazma !== false;
  cizim = null; cizKat.clearLayers();
  el('kodBas').textContent = tesis ? tesis.kod : 'Hatlar';
  ciz(); dugmeler();
  const kaps = [];
  if (tesis) kaps.push([tesis.lat, tesis.lon]);
  hatlar.forEach(h => h.noktalar.forEach(p => kaps.push(p)));
  if (kaps.length > 1) map.fitBounds(L.latLngBounds(kaps).pad(.3));
  else if (kaps.length === 1) map.setView(kaps[0], 16);
  el('durum').textContent = yazma ? '' : 'Yalnız görüntüleme';
});
turleriCiz(); ciz(); dugmeler();
map.whenReady(() => setTimeout(() => map.invalidateSize(), 60));
new ResizeObserver(() => map.invalidateSize()).observe(el('map'));
el('hatlarAc').onclick = () => el('panel').classList.toggle('acik');
// çizime başlayınca liste paneli kapanır: harita açık kalsın
el('ciz').addEventListener('click', () => el('panel').classList.remove('acik'));
try { parent.postMessage({ ks: 'hatHazir' }, '*'); } catch (e) { /* çerçeve yok */ }
</script>
</body>
</html>
