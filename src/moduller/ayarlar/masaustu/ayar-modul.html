<sc-if value="{{ ayar.modul }}" hint-placeholder-val="{{ false }}">
<div style="padding:16px 20px">
<div class="ks-bilgi" style="font:400 12.5px/1.5 var(--font-body);color:{{ ui.mut }};max-width:760px">{{ moduller.not }}</div>
<div style="display:flex;flex-direction:column;margin-top:16px">
<sc-for list="{{ moduller.list }}" as="m" hint-placeholder-count="2">
<div style="display:flex;align-items:flex-start;gap:20px;padding:15px 0;border-top:1px solid {{ ui.rule }}">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px">
<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
<span style="font:600 15px/1.15 var(--font-heading);letter-spacing:-.022em;color:{{ ui.fg }}">{{ m.ad }}</span>
<span style="font:400 12px/1.3 var(--font-body);color:{{ ui.mut }}">{{ m.sayi }}</span>
</div>
<span class="ks-bilgi" style="font:400 12.5px/1.55 var(--font-body);color:{{ ui.mut }};max-width:58em">{{ m.aciklama }}</span>
</div>
<div style="flex:none;display:flex;border-radius:10px;border:1px solid {{ ui.rule }};width:186px">
<button onClick="{{ m.ac.pick }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;padding:11px 6px;background:{{ m.ac.bg }};color:{{ m.ac.fg }};font:600 12px/1 var(--font-body);letter-spacing:-.01em;border-right:1px solid {{ ui.rule }}">Açık</button>
<button onClick="{{ m.kapa.pick }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;padding:11px 6px;background:{{ m.kapa.bg }};color:{{ m.kapa.fg }};font:600 12px/1 var(--font-body);letter-spacing:-.01em">Kapalı</button>
</div>
</div>
</sc-for>
</div>
</div>
</sc-if>
