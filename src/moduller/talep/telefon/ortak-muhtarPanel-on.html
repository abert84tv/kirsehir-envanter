<sc-if value="{{ muhtarPanel.on }}" hint-placeholder-val="{{ false }}">
<div style="position:fixed;inset:0;z-index:96;background:rgba(32,30,29,.6);overflow:auto;padding:20px;display:flex;justify-content:center;align-items:flex-start">
<div style="width:460px;max-width:100%;background:{{ ui.surf }};border-radius:14px;overflow:hidden">
<div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid {{ ui.rule }}">
<span style="flex:1;font:600 15px/1 var(--font-heading);color:{{ ui.fg }}">Muhtar numara defteri</span>
<button onClick="{{ muhtarPanel.kapat }}" style="all:unset;box-sizing:border-box;cursor:pointer;border-radius:8px;border:1px solid {{ ui.rule }};color:{{ ui.mut }};font:600 11.5px/1 var(--font-body);padding:8px 12px">Kapat</button>
</div>
<sc-if value="{{ !muhtarPanel.form }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid {{ ui.rule }}">
<input value="{{ muhtarPanel.q }}" onChange="{{ muhtarPanel.onQ }}" placeholder="Ad, köy veya telefon ara" style="all:unset;box-sizing:border-box;flex:1;border-radius:10px;border:1px solid {{ ui.rule }};padding:10px 12px;font:600 12.5px/1 var(--font-body);color:{{ ui.fg }};background:{{ ui.bg }}">
<sc-if value="{{ muhtarPanel.yeniVar }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ muhtarPanel.yeni }}" class="btn btn-primary" style="flex:none;border:none;cursor:pointer;font:600 12px/1 var(--font-body);padding:10px 14px">Ekle</button>
</sc-if>
</div>
<div style="max-height:56vh;overflow:auto">
<sc-for list="{{ muhtarPanel.liste }}" as="mh" hint-placeholder-count="0">
<div style="display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid {{ ui.rule }}">
<div style="flex:1;min-width:0">
<div style="font:600 13px/1.3 var(--font-body);color:{{ ui.fg }}">{{ mh.ad }}</div>
<div style="font:400 12px/1.4 var(--font-body);color:{{ ui.mut }}">{{ mh.yer }} · {{ mh.tel }}</div>
</div>
<button onClick="{{ mh.duzenle }}" style="all:unset;box-sizing:border-box;cursor:pointer;padding:7px 10px;border-radius:8px;border:1px solid {{ ui.rule }};font:600 11px/1 var(--font-body);color:{{ ui.fg }}">Düzenle</button>
<button onClick="{{ mh.sil }}" style="all:unset;box-sizing:border-box;cursor:pointer;padding:7px 10px;border-radius:8px;border:1px solid var(--color-uyari);font:600 11px/1 var(--font-body);color:var(--color-uyari)">Sil</button>
</div>
</sc-for>
<sc-if value="{{ muhtarPanel.listeBos }}" hint-placeholder-val="{{ true }}">
<div style="padding:24px 16px;text-align:center;font:400 12.5px/1.5 var(--font-body);color:{{ ui.mut }}">Kayıtlı muhtar yok — "Ekle" ile başlayın.</div>
</sc-if>
</div>
</sc-if>
<sc-if value="{{ muhtarPanel.form }}" hint-placeholder-val="{{ false }}">
<div style="padding:16px;display:flex;flex-direction:column;gap:10px">
<span style="font:600 13px/1 var(--font-body);color:{{ ui.fg }}">{{ muhtarPanel.form.baslik }}</span>
<input value="{{ muhtarPanel.form.ad }}" onChange="{{ muhtarPanel.form.onAd }}" placeholder="Muhtar adı" style="all:unset;box-sizing:border-box;border-radius:10px;border:1px solid {{ ui.rule }};padding:11px;font:600 13px/1 var(--font-body);color:{{ ui.fg }};background:{{ ui.bg }}">
<input value="{{ muhtarPanel.form.koy }}" onChange="{{ muhtarPanel.form.onKoy }}" placeholder="Köy" style="all:unset;box-sizing:border-box;border-radius:10px;border:1px solid {{ ui.rule }};padding:11px;font:600 13px/1 var(--font-body);color:{{ ui.fg }};background:{{ ui.bg }}">
<input value="{{ muhtarPanel.form.ilce }}" onChange="{{ muhtarPanel.form.onIlce }}" placeholder="İlçe" style="all:unset;box-sizing:border-box;border-radius:10px;border:1px solid {{ ui.rule }};padding:11px;font:600 13px/1 var(--font-body);color:{{ ui.fg }};background:{{ ui.bg }}">
<input value="{{ muhtarPanel.form.tel }}" onChange="{{ muhtarPanel.form.onTel }}" inputmode="tel" placeholder="0532 000 00 00" style="all:unset;box-sizing:border-box;border-radius:10px;border:1px solid {{ ui.rule }};padding:11px;font:600 13px/1 ui-monospace,Menlo,monospace;color:{{ ui.fg }};background:{{ ui.bg }}">
<div style="display:flex;gap:8px">
<button onClick="{{ muhtarPanel.form.iptal }}" style="all:unset;box-sizing:border-box;flex:1;text-align:center;cursor:pointer;border-radius:10px;border:1px solid {{ ui.rule }};color:{{ ui.mut }};font:600 12.5px/1 var(--font-body);padding:12px">Vazgeç</button>
<button onClick="{{ muhtarPanel.form.kaydet }}" class="btn btn-primary" style="flex:1;border:none;cursor:pointer;font:600 12.5px/1 var(--font-body);padding:12px;justify-content:center">Kaydet</button>
</div>
</div>
</sc-if>
</div>
</div>
</sc-if>
