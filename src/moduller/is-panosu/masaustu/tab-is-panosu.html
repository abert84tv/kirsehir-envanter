<sc-if value="{{ tab.isPanosu }}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="flex:1;overflow:auto;min-height:0;background:{{ ui.bg }};padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
<sc-for list="{{ isPanosuEkran.ozet }}" as="o" hint-placeholder-count="4">
<div style="display:flex;align-items:baseline;gap:6px">
<sc-if value="{{ o.alarm }}" hint-placeholder-val="{{ false }}"><span class="ks-canli ks-kapali"></span></sc-if>
<span style="font:700 22px/1 var(--font-heading);color:{{ o.renk }}">{{ o.n }}</span>
<span style="font:500 12.5px/1 var(--font-body);color:{{ ui.mut }}">{{ o.ad }}</span>
</div>
</sc-for>
<span style="flex:1"></span>
<sc-if value="{{ isPanosuEkran.yeniTalepVar }}" hint-placeholder-val="{{ false }}"><button onClick="{{ isPanosuEkran.yeniTalep }}" style="all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;padding:0 16px;border-radius:11px;background:var(--color-accent);color:#fff;font:700 13.5px/44px var(--font-body)">+ Yeni talep (telefon)</button></sc-if>
</div>
<div class="ks-bilgi" style="font:400 12px/1.4 var(--font-body);color:{{ ui.mut }}">{{ isPanosuEkran.yardim }}</div>
<div style="flex:1;display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;align-items:start;min-height:0">
<sc-for list="{{ isPanosuEkran.kolonlar }}" as="k" hint-placeholder-count="4">
<div onDragOver="{{ k.ustunde }}" onDragEnter="{{ k.girdi }}" onDrop="{{ k.birak }}" style="border-radius:16px;border:2px dashed {{ k.kenar }};background:{{ k.zemin }};padding:10px;display:flex;flex-direction:column;gap:10px;min-height:260px;transition:background .15s">
<div style="display:flex;align-items:center;gap:8px;padding:2px 4px 4px">
<span style="width:12px;height:12px;border-radius:4px;background:{{ k.renk }}"></span>
<span style="flex:1;font:700 15px/1 var(--font-heading)">{{ k.ad }}</span>
<span class="ks-nabiz" style="min-width:26px;text-align:center;font:700 13px/1 var(--font-body);color:#fff;background:{{ k.renk }};padding:5px 8px;border-radius:10px">{{ k.n }}</span>
</div>
<sc-for list="{{ k.kartlar }}" as="c" hint-placeholder-count="2">
<div draggable="{{ c.suruklenir }}" onDragStart="{{ c.surukleBasla }}" onDragEnd="{{ c.surukleBitti }}" class="ks-kart ks-gir" style="border-radius:13px;background:{{ ui.surf }};border:1px solid {{ ui.rule }};border-left:6px solid {{ c.renk }};padding:12px 13px;display:flex;flex-direction:column;gap:8px;cursor:{{ c.imlec }}">
<div style="display:flex;align-items:center;gap:9px">
<span class="{{ c.noktaSinif }}" style="background:{{ c.renk }}"></span>
<button onClick="{{ c.ac }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:1;min-width:0;font:700 14.5px/1.25 var(--font-heading);color:{{ ui.fg }}">{{ c.baslik }}</button>
</div>
<div style="display:flex;align-items:center;gap:8px"><span style="flex:1;min-width:0;font:500 12.5px/1.35 var(--font-body);color:{{ ui.mut }}">{{ c.yer }}</span><span style="flex:none;font:600 10.5px/1 var(--font-body);color:{{ ui.mut }};padding:4px 7px;border-radius:8px;background:{{ ui.surf2 }}">{{ c.tur }}</span></div>
<sc-if value="{{ c.aciklamaVar }}" hint-placeholder-val="{{ false }}"><div style="font:400 12px/1.4 var(--font-body);color:{{ ui.mut }}">{{ c.aciklama }}</div></sc-if>
<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
<span style="font:700 12.5px/1.2 var(--font-body);color:{{ c.kimRenk }}">{{ c.kim }}</span>
<span style="flex:1"></span>
<sc-if value="{{ c.kanalVar }}" hint-placeholder-val="{{ false }}"><span style="font:600 10.5px/1 var(--font-body);color:{{ ui.mut }};padding:3px 6px;border-radius:7px;border:1px solid {{ ui.rule }}">{{ c.kanal }}</span></sc-if>
<span style="font:500 11.5px/1 var(--font-body);color:{{ ui.mut }}">{{ c.sure }}</span>
</div>
<sc-if value="{{ c.uyariVar }}" hint-placeholder-val="{{ false }}"><div style="font:700 11.5px/1.2 var(--font-body);color:{{ c.uyariRenk }}">{{ c.uyari }}</div></sc-if>
<sc-if value="{{ c.ekipSec }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:6px;padding-top:2px">
<span style="font:600 11.5px/1 var(--font-body);color:{{ ui.mut }}">Hangi ekip gitsin?</span>
<sc-for list="{{ c.ekipSecenek }}" as="e" hint-placeholder-count="4">
<button onClick="{{ e.sec }}" style="all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid {{ ui.rule }};background:{{ ui.bg }};display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 13px/1.2 var(--font-body);color:{{ ui.fg }}"><span>{{ e.ad }}</span><span style="font:500 11.5px/1 var(--font-body);color:{{ ui.mut }}">{{ e.say }}</span></button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ c.dugmeVar }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;gap:8px">
<button onClick="{{ c.git }}" style="all:unset;white-space:nowrap;padding:0 6px;box-sizing:border-box;cursor:pointer;flex:1;min-height:46px;border-radius:11px;background:{{ c.dugmeRenk }};color:#fff;font:700 14px/46px var(--font-body);text-align:center">{{ c.dugme }}</button>
<sc-if value="{{ c.ikinciVar }}" hint-placeholder-val="{{ false }}"><button onClick="{{ c.ikinciGit }}" style="all:unset;white-space:nowrap;box-sizing:border-box;cursor:pointer;flex:none;min-height:46px;padding:0 14px;border-radius:11px;border:1px solid {{ ui.rule }};color:{{ ui.mut }};font:600 12.5px/44px var(--font-body)">{{ c.ikinci }}</button></sc-if>
</div>
</sc-if>
</div>
</sc-for>
<sc-if value="{{ k.bosVar }}" hint-placeholder-val="{{ false }}"><div style="padding:22px 8px;text-align:center;font:500 12.5px/1.4 var(--font-body);color:{{ ui.mut }}">{{ k.bos }}</div></sc-if>
</div>
</sc-for>
</div>
</div>
</sc-if>
