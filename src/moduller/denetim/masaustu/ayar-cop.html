<sc-if value="{{ ayar.cop }}" hint-placeholder-val="{{ false }}">
<div style="padding:16px 20px">
<div style="font:600 11px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.acc }};margin-bottom:6px">Çöp kutusu</div>
<div style="font:400 12.5px/1.5 var(--font-body);color:{{ ui.mut }};max-width:760px">{{ trash.not }}</div>
<sc-if value="{{ trash.topluVar }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ trash.toplu }}" title="Çöp kutusundaki bütün öğeleri veritabanından tamamen siler" style="all:unset;box-sizing:border-box;cursor:pointer;margin-top:12px;border-radius:10px;border:1px solid var(--color-accent);color:{{ ui.acc }};font:600 11.5px/1 var(--font-body);letter-spacing:-.01em;padding:12px 15px;display:inline-flex;align-items:center" style-hover="background:var(--color-accent);color:#fff">{{ trash.topluEtiket }}</button>
</sc-if>
<div style="display:flex;flex-direction:column;margin-top:10px">
<sc-for list="{{ trash.rows }}" as="r" hint-placeholder-count="0">
<div style="display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid {{ ui.rule }}">
<sc-if value="{{ r.onizlemeVar }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ r.buyut }}" title="Büyütmek için tıklayın" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:56px;height:56px;border-radius:10px;border:1px solid {{ ui.rule }};overflow:hidden;display:block">
{{ r.onizlemeEl }}
</button>
</sc-if>
<span style="display:flex;flex-direction:column;gap:3px;width:140px;min-width:0">
<span style="font:600 13.5px/1.15 var(--font-heading);color:{{ ui.fg }}">{{ r.code }}</span>
<span style="font:400 11px/1.3 ui-monospace,Menlo,monospace;color:{{ ui.mut }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ r.dosyaAd }}</span>
</span>
<sc-if value="{{ r.sesVar }}" hint-placeholder-val="{{ false }}">
<span style="flex:none;width:170px">{{ r.sesEl }}</span>
</sc-if>
<span style="font:400 12.5px/1 var(--font-body);color:{{ ui.mut }};width:120px">{{ r.kind }}</span>
<span style="font:400 12.5px/1 var(--font-body);color:{{ ui.mut }};width:190px">{{ r.place }}</span>
<span style="flex:1;font:400 12px/1.35 var(--font-body);color:{{ ui.mut }}">{{ r.meta }}</span>
<button onClick="{{ r.geri }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;border-radius:10px;border:1px solid var(--color-accent);color:{{ ui.acc }};font:600 11px/1 var(--font-body);letter-spacing:-.01em;padding:10px 12px">Geri getir</button>
<sc-if value="{{ r.kaliciVar }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ r.kalici }}" title="Veritabanından tamamen siler — geri alınamaz" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;border-radius:10px;border:1px solid {{ ui.rule }};color:{{ ui.mut }};font:600 11px/1 var(--font-body);letter-spacing:-.01em;padding:10px 12px" style-hover="border-color:var(--color-accent);color:var(--color-accent)">Kalıcı sil</button>
</sc-if>
</div>
</sc-for>
</div>
</div>
</sc-if>
