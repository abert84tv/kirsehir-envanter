<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Özet haritası</title>
<link rel="stylesheet" href="./vendor/leaflet.css">
<script src="./vendor/leaflet.js"></script>
<link rel="stylesheet" href="harita-ortak.css">
<style>
  :root{--color-accent:#0071e3;--ikon-bg:#ffffff;--ikon-kenar:rgba(0,0,0,.12);--ikon-hover:rgba(0,113,227,.12)}
  body.dark{--color-accent:#0a84ff;--ikon-bg:#1c1c1e;--ikon-kenar:rgba(255,255,255,.14);--ikon-hover:rgba(10,132,255,.22)}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  #map{position:absolute;inset:0;background:#e8e8ed}
  body.dark #map{background:#1c1c1e}
  .leaflet-container{font-family:inherit}
  .ks-ot{font:600 12px/1.35 inherit;letter-spacing:-.01em;border-radius:8px}
  .ks-ot small{display:block;font-weight:500;opacity:.7;font-size:10.5px}
  body.dark .leaflet-tooltip.ks-ot{background:rgba(28,28,30,.94);border-color:rgba(255,255,255,.14);color:#f5f5f7}
  body.dark .leaflet-tooltip.ks-ot:before{display:none}
  .leaflet-control-attribution{font-size:9px}
  /* Katman simgesi: tıklayınca zemin menüsü açılır, başka yere tıklayınca kapanır */
  #katman{position:absolute;top:10px;right:10px;z-index:1000;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  #katman-dugme{all:unset;box-sizing:border-box;cursor:pointer;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:11px;background:var(--ikon-bg);border:1px solid var(--ikon-kenar);color:var(--color-accent,#0071e3);box-shadow:0 2px 8px rgba(0,0,0,.18);transition:background-color .12s ease,border-color .12s ease,color .12s ease}
  #katman-dugme:hover{background:var(--ikon-hover);border-color:var(--color-accent,#0071e3)}
  #katman-dugme svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  #katman.acik #katman-dugme{background:var(--color-accent,#0071e3);border-color:var(--color-accent,#0071e3);color:#fff}
  #katman-menu{display:none;flex-direction:column;min-width:150px;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 8px 26px rgba(0,0,0,.35)}
  #katman.acik #katman-menu{display:flex;animation:ac .14s ease-out}
  @keyframes ac{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
  #katman-menu button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1d1d1f;border-bottom:1px solid rgba(0,0,0,.07)}
  #katman-menu button:last-child{border-bottom:none}
  #katman-menu button:hover{background:rgba(0,113,227,.08)}
  #katman-menu button i{width:14px;height:14px;border-radius:50%;border:2px solid #9a9aa0;flex:none;box-sizing:border-box}
  #katman-menu button.on i{border-color:#0071e3;background:radial-gradient(#0071e3 45%,transparent 50%)}
  body.dark #katman-menu{background:#2c2c2e}
  body.dark #katman-menu button{color:#f5f5f7;border-bottom-color:rgba(255,255,255,.1)}
  body.dark #katman-menu button.on i{border-color:#0a84ff;background:radial-gradient(#0a84ff 45%,transparent 50%)}
</style>
</head>
<body>
<div id="map"></div>
<div id="katman">
  <button id="katman-dugme" aria-label="Harita katmanları" title="Harita katmanları"><svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/><path d="m3 17.5 9 5 9-5" opacity=".55"/></svg></button>
  <div id="katman-menu">
    <button data-z="street"><i></i>Sokak</button>
    <button data-z="sat"><i></i>Uydu</button>
    <button data-z="hyb"><i></i>Uydu + ad</button>
  </div>
</div>
<script>
// Özet > Dağılım haritası: gerçek harita zemini (sokak / uydu / uydu + yer adları) üzerinde kayıtlar tür renginde noktalar.
// Veri ana pencereden gelir ({ks:'ozetVeri'}); noktaya basınca ana pencereye {ks:'ozetSec'} gider.
const mobil = L.Browser.mobile;
// #ata: Envanter > “Köyü boş” kayıtlara köy atama penceresinde kullanılır (kayıtlar seçilir, aday köyler etiketlenir)
const ATA = location.hash === '#ata';
// #is: İş kartı / arıza kartındaki küçük yer haritası (hedef nokta, aday tesisler, varsa ekip konumları)
const IS = location.hash === '#is';
const map = L.map('map', {
  center: [39.15, 34.16], zoom: 9, zoomSnap: .5, zoomDelta: .5, preferCanvas: true,
  scrollWheelZoom: !mobil || ATA || IS,         // masaüstünde fare haritanın üstündeyken tekerlek yakınlaştırır/uzaklaştırır; telefonda iki parmak
  dragging: !mobil || ATA || IS,         // telefonda tek parmak sayfayı kaydırır, iki parmak haritayı yakınlaştırır (atama penceresi sabit olduğundan tek parmak yeter)
  tap: false
});
const street = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap katkıcıları', maxZoom: 19, className: 'ks-tiles', updateWhenZooming: false, keepBuffer: 1 });
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Uydu görüntüsü: Esri, Maxar, Earthstar Geographics', maxZoom: 19, className: 'ks-sat', updateWhenZooming: false, keepBuffer: 1 });
const satAd = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { attribution: 'Yer adları: Esri', maxZoom: 19, pane: 'shadowPane' });
let zemin = null;
function zeminSec(k) {
  if (k === zemin) return;
  zemin = k;
  street.remove(); sat.remove(); satAd.remove();
  if (k === 'street') street.addTo(map); else { sat.addTo(map); if (k === 'hyb') satAd.addTo(map); }
}
zeminSec('hyb');
// Katman menüsü: simgeye basınca açılır; bir seçenek seçince ya da başka bir yere (harita dahil) basınca kapanır
const katman = document.getElementById('katman');
function menuIsaret() { document.querySelectorAll('#katman-menu button').forEach(b => b.classList.toggle('on', b.dataset.z === zemin)); }
function menuKapat() { katman.classList.remove('acik'); }
document.getElementById('katman-dugme').addEventListener('click', e => { e.stopPropagation(); menuIsaret(); katman.classList.toggle('acik'); });
document.querySelectorAll('#katman-menu button').forEach(b => b.addEventListener('click', e => {
  e.stopPropagation();
  zeminSec(b.dataset.z); menuIsaret(); menuKapat();
  parent.postMessage({ ks: 'ozetZemin', zemin: b.dataset.z }, '*');     // seçim ana pencerede hatırlanır
}));
document.addEventListener('click', menuKapat);
addEventListener('blur', menuKapat);   // sayfanın harita dışındaki bir yerine basılınca da kapanır
map.on('click movestart zoomstart', menuKapat);
const noktalar = L.layerGroup().addTo(map);
let sigdi = false, sonImza = '';
function ciz(d) {
  document.body.classList.toggle('dark', !!d.dark);
  zeminSec(d.zemin || 'hyb');
  const tum = d.noktalar || [], gizli = d.gizli || [], renk = d.renk || {};
  // imza değişmediyse yeniden çizme (yalnız zemin değiştiyse noktalar kalır)
  const imza = tum.length + ':' + tum.filter(a => a.pasif).length + '|' + gizli.join(',') + '|' + (d.dark ? 1 : 0);
  if (imza !== sonImza) {
    sonImza = imza; noktalar.clearLayers();
    for (const a of tum) {
      if (gizli.includes(a.type)) continue;
      const m = L.circleMarker([a.lat, a.lon], { radius: 5.5, weight: 1.6, color: '#fff', fillColor: renk[a.type] || '#0071e3', fillOpacity: a.pasif ? .45 : .95 });
      m.bindTooltip('<b>' + esc(a.code) + '</b><small>' + esc(a.village ? a.village + ' · ' + a.district : a.district) + '</small>', { direction: 'top', offset: [0, -6], className: 'ks-ot' });
      m.on('mouseover', () => m.setRadius(8)); m.on('mouseout', () => m.setRadius(5.5));
      m.on('click', () => parent.postMessage({ ks: 'ozetSec', id: a.id }, '*'));
      m.addTo(noktalar);
    }
  }
  // ilk veride (ve kayıt sayısı değişince) harita bütün kayıtlara sığdırılır; süzgeç değişince kaymaz
  if (!sigdi && tum.length) {
    sigdi = true;
    map.invalidateSize();
    map.fitBounds(L.latLngBounds(tum.map(a => [a.lat, a.lon])).pad(0.08));
  }
}
function esc(x) { return String(x == null ? '' : x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
// ── Köy atama modu: seçilecek kayıtlar (turuncu; seçilince mavi) ve aday köyler (koyu nokta + ad etiketi)
const ataKayit = L.layerGroup().addTo(map), ataKoy = L.layerGroup().addTo(map);
let ataSigdi = false;
function ataCiz(d) {
  document.body.classList.toggle('dark', !!d.dark);
  zeminSec(d.zemin || 'hyb');
  ataKayit.clearLayers(); ataKoy.clearLayers();
  const k = d.kayitlar || [];
  for (const a of k) {
    const m = L.circleMarker([a.lat, a.lon], a.sec
      ? { radius: 9, weight: 3, color: '#fff', fillColor: '#0071e3', fillOpacity: 1 }
      : { radius: 6.5, weight: 1.6, color: '#fff', fillColor: '#f59e0b', fillOpacity: .95 });
    m.bindTooltip('<b>' + esc(a.code) + '</b><small>' + esc(a.ilce) + (a.oneri ? ' · en yakın: ' + esc(a.oneri) : '') + '</small>', { direction: 'top', offset: [0, -8], className: 'ks-ot' });
    m.on('click', ev => { L.DomEvent.stopPropagation(ev); parent.postMessage({ ks: 'koyAtaTik', id: a.id }, '*'); });
    m.addTo(ataKayit);
  }
  for (const v of (d.koyler || [])) {
    const m = L.circleMarker([v.lat, v.lon], { radius: v.hedef ? 8 : 5, weight: 2, color: '#fff', fillColor: v.hedef ? '#1b9a4a' : '#3a3a3c', fillOpacity: 1 });
    m.bindTooltip(esc(v.ad) + (v.km != null ? ' · ' + v.km + ' km' : ''), { permanent: true, direction: 'right', offset: [8, 0], className: 'ks-ot' });
    m.on('click', ev => { L.DomEvent.stopPropagation(ev); parent.postMessage({ ks: 'koyAtaKoy', ad: v.ad, ilce: v.ilce || '' }, '*'); });
    m.addTo(ataKoy);
  }
  if (!ataSigdi && k.length) { ataSigdi = true; map.invalidateSize(); map.fitBounds(L.latLngBounds(k.map(a => [a.lat, a.lon])).pad(0.08)); }
  if (d.odak) { map.invalidateSize(); map.setView([d.odak.lat, d.odak.lon], Math.max(map.getZoom(), 13)); }
}
// ── İş kartı modu
const isGrup = L.layerGroup().addTo(map);
let isImza = '';
function isCiz(d) {
  document.body.classList.toggle('dark', !!d.dark);
  zeminSec(d.zemin || 'hyb');
  isGrup.clearLayers();
  const nok = [], renk = d.renk || {};
  for (const a of (d.tesisler || [])) {
    const sec = a.id === d.secId;
    const m = L.circleMarker([a.lat, a.lon], { radius: sec ? 9 : 7, weight: sec ? 3 : 1.8, color: '#fff', fillColor: sec ? '#1b9a4a' : (renk[a.type] || '#0071e3'), fillOpacity: 1 });
    m.bindTooltip('<b>' + esc(a.code) + '</b><small>' + esc(a.yer || '') + (a.km ? ' · ' + esc(a.km) : '') + '</small>', { direction: 'top', offset: [0, -8], className: 'ks-ot', permanent: sec });
    if (d.secilebilir) m.on('click', ev => { L.DomEvent.stopPropagation(ev); parent.postMessage({ ks: 'isTesisSec', id: a.id }, '*'); });
    m.addTo(isGrup); nok.push([a.lat, a.lon]);
  }
  for (const e of (d.ekipler || [])) {
    const m = L.circleMarker([e.lat, e.lon], { radius: 8, weight: 3, color: '#fff', fillColor: e.taze ? '#8e44ad' : '#8e8e93', fillOpacity: 1 });
    m.bindTooltip('<b>' + esc(e.ad) + '</b><small>' + esc(e.not || '') + '</small>', { direction: 'top', offset: [0, -8], className: 'ks-ot', permanent: true });
    m.addTo(isGrup); nok.push([e.lat, e.lon]);
  }
  if (d.hedef) {
    const m = L.circleMarker([d.hedef.lat, d.hedef.lon], { radius: 9, weight: 3, color: '#fff', fillColor: '#ec3013', fillOpacity: 1 });
    m.bindTooltip(esc(d.hedef.ad || 'Arıza yeri'), { direction: 'top', offset: [0, -8], className: 'ks-ot', permanent: true });
    m.addTo(isGrup); nok.push([d.hedef.lat, d.hedef.lon]);
  }
  // sığdırma yalnız veri kümesi değişince (kullanıcı kaydırırken zıplamasın)
  const imza = nok.map(x => x.join(',')).join('|');
  if (imza !== isImza && nok.length) { isImza = imza; map.invalidateSize(); nok.length === 1 ? map.setView(nok[0], 14) : map.fitBounds(L.latLngBounds(nok).pad(0.25), { maxZoom: 15 }); }
}
addEventListener('message', e => { const d = e.data || {}; if (d.ks === 'ozetVeri' && !ATA && !IS) ciz(d); if (d.ks === 'koyAtaVeri' && ATA) ataCiz(d); if (d.ks === 'isHaritaVeri' && IS) isCiz(d); });
addEventListener('resize', () => map.invalidateSize());
parent.postMessage({ ks: ATA ? 'koyAtaHazir' : IS ? 'isHaritaHazir' : 'ozetHaritaHazir' }, '*');
</script>
</body>
</html>
