<sc-if value="{{ tab.bakim }}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="flex:1;overflow:auto;min-height:0">
<div style="padding:13px 14px;border-bottom:1px solid {{ ui.rule }};background:{{ ui.surf }}">
<div style="font:600 17px/1.1 var(--font-heading);letter-spacing:-.022em;margin-bottom:4px">Bakım takvimi</div>
<div style="font:400 11.5px/1.45 var(--font-body);color:{{ ui.mut }}">Kuyular 6 ayda bir, depo ve elektrik tesisleri 12 ayda bir.</div>
</div>
<div style="display:flex;flex-wrap:wrap;border-bottom:1px solid {{ ui.rule }}">
<sc-for list="{{ bakim.stats }}" as="st" hint-placeholder-count="4">
<div style="width:50%;padding:12px 14px;border-bottom:1px solid {{ ui.rule }};display:flex;flex-direction:column;gap:3px">
<span style="font:600 22px/1 var(--font-heading);letter-spacing:-.022em;color:{{ st.fg }}">{{ st.n }}</span>
<span style="font:600 10px/1.2 var(--font-body);letter-spacing:-.01em;color:{{ ui.mut }}">{{ st.label }}</span>
</div>
</sc-for>
</div>
<sc-if value="{{ bakim.gecikenlerVar }}" hint-placeholder-val="{{ false }}">
<div style="padding:11px 14px;border-bottom:1px solid {{ ui.rule }};font:600 10.5px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.acc }}">Geciken bakımlar</div>
<sc-for list="{{ bakim.gecikenler }}" as="b" hint-placeholder-count="6">
<div style="padding:11px 14px;border-bottom:1px solid {{ ui.rule }};background:{{ b.bg }};display:flex;align-items:center;gap:10px">
<button onClick="{{ b.open }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left">
<span style="font:600 13.5px/1.2 var(--font-heading);color:{{ ui.fg }}">{{ b.code }}</span>
<span style="font:600 12px/1 var(--font-body);color:{{ b.fg }}">{{ b.label }}</span>
<span style="font:400 11px/1.3 var(--font-body);color:{{ ui.mut }}">{{ b.place }} · {{ b.son }}</span>
<span style="font:400 11px/1.3 var(--font-body);color:{{ ui.mut }}">{{ b.hedef }} · {{ b.per }}</span>
</button>
<button onClick="{{ b.git }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;border-radius:10px;border:1px solid {{ ui.rule }};color:{{ ui.mut }};font:600 10.5px/1 var(--font-body);padding:11px 9px">Git</button>
<sc-if value="{{ b.canDone }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ b.done }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;border-radius:10px;border:1px solid var(--color-accent);color:{{ ui.acc }};font:600 10.5px/1 var(--font-body);padding:11px 10px">Yapıldı</button>
</sc-if>
</div>
</sc-for>
</sc-if>
<sc-if value="{{ bakim.yaklasanlarVar }}" hint-placeholder-val="{{ false }}">
<div style="padding:11px 14px;border-bottom:1px solid {{ ui.rule }};border-top:1px solid {{ ui.rule }};font:600 10.5px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.acc }}">30 gün içinde</div>
<sc-for list="{{ bakim.yaklasanlar }}" as="b" hint-placeholder-count="6">
<div style="padding:11px 14px;border-bottom:1px solid {{ ui.rule }};display:flex;align-items:center;gap:10px">
<button onClick="{{ b.open }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left">
<span style="font:600 13.5px/1.2 var(--font-heading);color:{{ ui.fg }}">{{ b.code }}</span>
<span style="font:600 12px/1 var(--font-body);color:{{ b.fg }}">{{ b.label }}</span>
<span style="font:400 11px/1.3 var(--font-body);color:{{ ui.mut }}">{{ b.place }}</span>
<span style="font:400 11px/1.3 var(--font-body);color:{{ ui.mut }}">{{ b.hedef }} · {{ b.per }}</span>
</button>
<button onClick="{{ b.git }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;border-radius:10px;border:1px solid {{ ui.rule }};color:{{ ui.mut }};font:600 10.5px/1 var(--font-body);padding:11px 9px">Git</button>
<sc-if value="{{ b.canDone }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ b.done }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;border-radius:10px;border:1px solid {{ ui.rule }};color:{{ ui.fg }};font:600 10.5px/1 var(--font-body);padding:11px 10px">Yapıldı</button>
</sc-if>
</div>
</sc-for>
</sc-if>
<sc-if value="{{ bakim.kayitsizVar }}" hint-placeholder-val="{{ false }}">
<div style="padding:11px 14px;border-bottom:1px solid {{ ui.rule }};border-top:1px solid {{ ui.rule }}">
<div style="font:600 10.5px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.acc }};margin-bottom:5px">Bakım kaydı olmayanlar</div>
<div style="font:400 11px/1.4 var(--font-body);color:{{ ui.mut }}">{{ bakim.kayitsizNot }}</div>
</div>
<sc-for list="{{ bakim.kayitsiz }}" as="b" hint-placeholder-count="8">
<div style="padding:11px 14px;border-bottom:1px solid {{ ui.rule }};display:flex;align-items:center;gap:10px">
<button onClick="{{ b.open }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left">
<span style="font:600 13.5px/1.2 var(--font-heading);color:{{ ui.fg }}">{{ b.code }}</span>
<span style="font:400 11px/1.3 var(--font-body);color:{{ ui.mut }}">{{ b.place }} · {{ b.kind }}</span>
<span style="font:400 11px/1.3 var(--font-body);color:{{ ui.mut }}">{{ b.per }} · {{ b.hedef }}</span>
</button>
<button onClick="{{ b.git }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;border-radius:10px;border:1px solid {{ ui.rule }};color:{{ ui.mut }};font:600 10.5px/1 var(--font-body);padding:11px 9px">Git</button>
<sc-if value="{{ b.canDone }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ b.done }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;border-radius:10px;border:1px solid {{ ui.rule }};color:{{ ui.mut }};font:600 10.5px/1 var(--font-body);padding:11px 10px">Bugün</button>
</sc-if>
</div>
</sc-for>
</sc-if>
<div style="height:14px"></div>
</div>
</sc-if>
