<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kırşehir — gerçek harita katmanı</title>
<link rel="stylesheet" href="_ds/modernist-803f2872-3d47-4f54-a490-6b99844264cd/styles.css">
<style id="ks-tema">
/* Arayüz yenilemesi — ana pencereyle aynı belirteçler.
   Tasarım sisteminin kırmızı vurgusu maviye çevrildi; kırmızı yalnız uyarı. */
:root{
 --font-heading:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 --color-bg:#f5f5f7;--color-text:#1d1d1f;--color-divider:rgba(0,0,0,.09);--color-surface:#ffffff;
 --color-neutral-100:#fbfbfd;--color-neutral-200:#f0f0f3;--color-neutral-300:#e4e4e9;
 --color-neutral-400:#c9c9ce;--color-neutral-500:#aeaeb2;--color-neutral-600:#6e6e73;
 --color-neutral-700:#48484a;--color-neutral-800:#2c2c2e;--color-neutral-900:#1d1d1f;
 --color-accent:#0071e3;--color-accent-100:#eef5ff;--color-accent-200:#d9e9ff;
 --color-accent-300:#aecfff;--color-accent-400:#5aa9ff;--color-accent-500:#0071e3;
 --color-accent-600:#0062c6;--color-accent-700:#0a57a8;--color-accent-800:#0a4382;--color-accent-900:#093362;
 --color-uyari:#d70015;
 --radius-md:12px;--radius-sm:9px;--radius-lg:18px;
 --shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow-md:0 4px 18px rgba(0,0,0,.07);--shadow-lg:0 18px 48px rgba(0,0,0,.14);
}
body{-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
</style>

<link rel="stylesheet" href="./vendor/leaflet.css">
<script src="./vendor/leaflet.js"></script>
<link rel="stylesheet" href="harita-ortak.css">
<script src="harita-ortak.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:var(--font-body);background:var(--color-bg)}
  #map{position:absolute;inset:0}
  .leaflet-container{background:#e8e8ed;font-family:var(--font-body)}
  .ks-pin{display:flex;align-items:center;justify-content:center;width:24px;height:24px;
    border:1px solid var(--color-divider);border-radius:9px;background:#fff;color:var(--color-text);
    font:600 12.5px/1 var(--font-body)}
  .ks-pin.pend{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
  .ks-pin.fault{background:var(--color-accent);border-color:var(--color-text);color:#fff}
  /* pasif tesis: kesikli çerçeve, soluk — haritada bir bakışta ayrılır */
  .ks-pin.pasif{background:#3f4a5a;border-style:dashed;border-color:#eceaea;color:#fff;opacity:1}
  .ks-pin.pasif:after{content:'';position:absolute;width:26px;height:2px;
    background:#eceaea;transform:rotate(-45deg)}
  body.dark .ks-pin.pasif{background:#8f9bb0;border-color:#000000;color:#000000}
  body.dark .ks-pin.pasif:after{background:#000000}
  /* ISU referans noktaları (kaynak/memba/depo) — henüz kayıt değil, kesikli
     çerçeveyle ayrılır; her katmanın kendi rengi var, tıklama gerçek kayda
     çevirir (bkz. noktaBirak). */
  .ks-pin.ref{background:#fff;border-style:dashed;border-width:2px}
  .ks-pin.ref-kaynak{color:#0891b2;border-color:#0891b2}
  .ks-pin.ref-memba{color:#15803d;border-color:#15803d}
  .ks-pin.ref-depo{color:#b45309;border-color:#b45309}
  body.dark .ks-pin.ref{background:#1c1c1e}
  body.dark .ks-pin.ref-kaynak{color:#22d3ee;border-color:#22d3ee}
  body.dark .ks-pin.ref-memba{color:#4ade80;border-color:#4ade80}
  body.dark .ks-pin.ref-depo{color:#fbbf24;border-color:#fbbf24}
  .ks-pin{position:relative;transition:background-color .12s ease,border-color .12s ease,color .12s ease}
  .leaflet-marker-icon:hover .ks-pin{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
  .ks-me{width:18px;height:18px;border:3px solid #fff;background:#1b6ef3;border-radius:50%;
    box-shadow:0 0 0 2px rgba(27,110,243,.45)}
  .ks-lbl{background:rgba(255,255,255,.94);border:1px solid var(--color-divider);border-radius:7px;
    padding:2px 7px;font:600 12px/1.35 var(--font-body);letter-spacing:-.01em;color:var(--color-text);
    box-shadow:0 1px 3px rgba(0,0,0,.14);white-space:nowrap;pointer-events:auto;cursor:pointer;
    transition:background-color .12s ease,border-color .12s ease,color .12s ease}
  .ks-lbl:hover{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
  .ks-lbl:before{display:none}
  .ks-dist{background:rgba(29,29,31,.9);border:none;border-radius:13px;color:#fff;
    padding:3px 10px;font:600 12px/1.35 var(--font-body);letter-spacing:-.01em;box-shadow:0 1px 4px rgba(0,0,0,.2)}
  .ks-dist:before{display:none}
  .panel{position:absolute;z-index:500;background:var(--color-bg);border:1px solid var(--color-divider);border-radius:9px}
  #tools{right:12px;top:12px;border:none;background:none;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  #tools .body{display:none;flex-direction:column;gap:6px;align-items:stretch;width:168px}
  #tools.open .body{display:flex;animation:ksMenuAc .16s ease-out}
  @keyframes ksMenuAc{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
  #menu{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 12px;
    background:var(--color-bg);border:1px solid var(--color-divider);border-radius:9px;font:600 11px/1 var(--font-body);
    letter-spacing:-.01em;color:var(--color-text)}
  #menu:hover{background:var(--color-neutral-200)}
  #tools.open #menu{background:var(--color-text);border-color:var(--color-text);color:#fff}
  #menu .bars{display:flex;flex-direction:column;gap:2.5px}
  #menu .bars i{display:block;width:13px;height:2px;background:currentColor}
  #tools button{all:unset;cursor:pointer;padding:8px 11px;background:var(--color-bg);
    border:1px solid var(--color-divider);border-radius:9px;font:600 11px/1 var(--font-body);letter-spacing:-.01em;
    color:var(--color-text);text-align:left}
  /* #tools button kuralı all:unset ile #menu'nün display:flex'ini siliyordu;
     çizgiler yazının üstüne iniyordu — burada tek satıra sabitlenir */
  #tools > #menu{display:flex;align-items:center;gap:8px;padding:9px 12px;white-space:nowrap;text-align:left}
  #tools button:hover{background:var(--color-neutral-200)}
  #tools button.on{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
  #tools .grp{display:flex;border:1px solid var(--color-divider);border-radius:9px;background:var(--color-bg)}
  #tools .grp button{border:none;border-right:1px solid var(--color-divider);flex:1;text-align:center;padding:8px 9px}
  #tools .grp button:last-child{border-right:none}
  #tools .sep{height:5px}
  #route{right:12px;bottom:12px;max-width:280px;padding:0;display:none}
  #route.show{display:block}
  #route .rt-head{background:var(--color-text);color:#fff;padding:7px 10px;
    font:600 11px/1 var(--font-body);letter-spacing:-.01em}
  #route .rt-body{padding:10px}
  #route .rt-title{font:600 14px/1.2 var(--font-heading);color:var(--color-text)}
  #route .rt-nums{display:flex;gap:14px;margin:9px 0 8px}
  #route .rt-nums b{font:700 21px/1 var(--font-heading);color:var(--color-accent);display:block}
  #route .rt-nums span{font:600 10px/1.4 var(--font-body);letter-spacing:-.01em;color:var(--color-neutral-600)}
  #route .rt-note{font:400 11.5px/1.45 var(--font-body);color:var(--color-neutral-600)}
  #route .rt-acts{display:flex;gap:6px;margin-top:9px}
  #route .rt-acts a,#route .rt-acts button{all:unset;cursor:pointer;flex:1;text-align:center;padding:9px 6px;
    border:1px solid var(--color-divider);border-radius:9px;font:600 11px/1 var(--font-body);letter-spacing:-.01em;
    color:var(--color-text)}
  #route .rt-acts a{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
  /* Gerçek-siyah koyu tema — ana pencerenin th() işlevindeki tonlarla
     hizalı (bg #000, yüzey #1c1c1e, ayraç %13 beyaz). Önceki sıcak
     #1b1a19/#242221 tonları tasarım yenilemesinden önce kalmıştı ve
     programın geri kalanıyla uyuşmuyordu. */
  body.dark{background:#000000}
  body.dark .leaflet-container{background:#1c1c1e}
  body.dark #tools button,body.dark #tools .grp,body.dark #route{background:#1c1c1e;border-color:rgba(255,255,255,.13);color:#f5f5f7}
  body.dark #route .rt-note,body.dark #route .rt-nums span{color:rgba(235,235,245,.62)}
  body.dark #tools.open #menu{background:#f5f5f7;color:#000000}
  body.dark #route .rt-title,body.dark #route .rt-acts button{color:#f5f5f7}
  body.dark .ks-lbl{background:rgba(28,28,30,.92);border-color:rgba(255,255,255,.13);color:#f5f5f7}
  body.dark .ks-pin{background:#1c1c1e;border-color:#f5f5f7;color:#f5f5f7}
  /* .ks-tiles/.ks-sat karo kısma değerleri artık harita-ortak.css'te */
  body.dark #tools button.on{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
</style>
</head>
<body>
<div id="map"></div>
<div id="pickbar" style="display:none;position:absolute;left:0;right:0;top:0;z-index:1200;background:#0071e3;color:#fff;padding:11px 14px;font:700 12px/1.3 Archivo,system-ui,sans-serif;letter-spacing:.02em"></div>
<div class="panel" id="tools">
  <button id="menu"><span class="bars"><i></i><i></i><i></i></span><span id="menu-lbl">Harita menüsü</span></button>
  <div class="body">
  <div class="grp">
    <button id="b-street" class="on">Sokak</button>

  </div>
  <div class="sep"></div>
  <button id="t-nav">Yol tarifi modu</button>

<script type="module">
import * as DATA from './kirsehir-data.js';
import { buildAssets, TYPES, STATUS_LABEL } from './envanter.js';
import { ISU_KAYNAK, ISU_MEMBA, ISU_ISUDEPO } from './isu-katmanlar.js';

let { assets, faults } = buildAssets(DATA);
const KAPALI = ['cozuldu', 'iptal'];
let openFaults = new Set(faults.filter(f => !KAPALI.includes(f.status)).map(f => f.assetId));
let sonFilter = null;

const map = L.map('map', { center: [39.28, 33.97], zoom: 9, zoomControl: true, scrollWheelZoom: true, preferCanvas: true, zoomSnap: 0.5, zoomDelta: 0.5, wheelPxPerZoomLevel: 90 });
ksPinZoom(map, 12);
window.ksHarita = { map, durum: () => ({ canli: canli.size, oge: ogeler.length }), filtre: f => filtreUygula(f) };

// ── zeminler: sokak / uydu / uydu + yer adı
const street = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap katkıcıları', maxZoom: 19, className: 'ks-tiles', updateWhenZooming: false, keepBuffer: 1
});
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Uydu görüntüsü: Esri, Maxar, Earthstar Geographics', maxZoom: 19, className: 'ks-sat', updateWhenZooming: false, keepBuffer: 1
});
const satLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Yer adları: Esri', maxZoom: 19, pane: 'shadowPane'
});
street.addTo(map);
let base = 'street';
function setBase(kind, sessiz) {
  base = kind;
  street.remove(); sat.remove(); satLabels.remove();
  if (kind === 'street') street.addTo(map);
  else { sat.addTo(map); if (kind === 'hyb') satLabels.addTo(map); }
  for (const [id, k] of [['b-street', 'street'], ['b-sat', 'sat'], ['b-hyb', 'hyb']])
    document.getElementById(id).classList.toggle('on', k === kind);
  if (!sessiz) parent.postMessage({ ks: 'base', base: kind }, '*');
}
document.getElementById('b-street').onclick = () => setBase('street');
document.getElementById('b-sat').onclick = () => setBase('sat');
document.getElementById('b-hyb').onclick = () => setBase('hyb');

// ── ilçe merkezleri: kırmızı noktalar istek üzerine kaldırıldı
// (ilçe adı ve nüfusu Yerleşim ekranında duruyor)

// ── hat güzergâhları: kayıtlara bağlı terfi, isale, şebeke ve enerji hatları
const HAT_REN = { terfi: '#0071e3', isale: '#201e1d', sebeke: '#6c6763', ag: '#1b6ef3', og: '#7b3fbf', dc: '#c08a00' };
const HAT_AD = { terfi: 'Terfi hattı', isale: 'İsale hattı', sebeke: 'Şebeke hattı', ag: 'AG enerji hattı', og: 'OG enerji hattı', dc: 'GES DC hattı' };
const hatLayer = L.layerGroup().addTo(map);
const HAT_KEY = 'ks-hat-katman';
const SUZ_KEY = 'ks-suzgec';
let hatVeri = [], hatAcik = true;
try { hatAcik = localStorage.getItem(HAT_KEY) !== '0'; } catch (e) { /* depolama kapalı */ }
function hatMesafe(a, b) {
  const rd = x => x * Math.PI / 180;
  const dLat = rd(b[0] - a[0]), dLon = rd(b[1] - a[1]);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(rd(a[0])) * Math.cos(rd(b[0])) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371008.8 * Math.asin(Math.min(1, Math.sqrt(s)));
}
const hatKm = v => v >= 1000 ? (v / 1000).toFixed(v < 10000 ? 2 : 1) + ' km' : Math.round(v) + ' m';
function cizHatlar() {
  hatLayer.clearLayers();
  if (!hatAcik) return;
  for (const h of hatVeri) {
    const p = (h.noktalar || []).map(x => [+x[0], +x[1]]).filter(x => isFinite(x[0]) && isFinite(x[1]));
    if (p.length < 2) continue;
    let uz = 0;
    for (let i = 1; i < p.length; i++) uz += hatMesafe(p[i - 1], p[i]);
    const renk = HAT_REN[h.tur] || '#201e1d';
    L.polyline(p, { color: '#fff', weight: 8, opacity: .65 }).addTo(hatLayer);
    L.polyline(p, { color: renk, weight: 4.5, opacity: .95 })
      .bindTooltip((HAT_AD[h.tur] || h.tur) + (h.kod ? ' · ' + h.kod : '') + ' · ' + hatKm(uz), { sticky: true })
      .addTo(hatLayer);
  }
}
function hatKatman(ac) {
  hatAcik = !!ac;
  document.getElementById('t-hat').classList.toggle('on', hatAcik);
  try { localStorage.setItem(HAT_KEY, hatAcik ? '1' : '0'); } catch (e) { /* depolama kapalı */ }
  cizHatlar();
}
hatKatman(hatAcik);
document.getElementById('t-hat').onclick = () => {
  hatKatman(!hatAcik);
  // Tercih uygulamada saklanır: kullanıcı kapattıysa bir dahaki girişte kapalı gelir
  try { parent.postMessage({ ks: 'hatKatman', on: hatAcik }, '*'); } catch (e) { /* çerçeve yok */ }
};

// ── ISU referans katmanları: ad/açıklama taşımayan salt koordinat noktaları
// (kaynak, memba, depo — 2026.09.29). Kendi düğmeleri yok; envanterin var olan
// tür süzgecine (Kuyu/Depo/AG/GES) bağlıdır (bkz. filtreUygula): Depo süzgeci
// ISU_ISUDEPO'yu, Kaynak/Memba süzgeçleri de ISU_KAYNAK/ISU_MEMBA'yı kapsar.
// Tıklama mevcut "nokta bırak" akışını kullanır: kart açılır, "yeni kayıt"
// seçilirse o katmandaki nokta üzerinde çalışılmış olur.
// Üçü de aynı kuralla kodlanır — statik değil, "eslesir" alanında verilen
// gerçek tür(ler)e 30 m'den yakın ISU noktası elenir, yalnız aynı fiziksel
// yerin ikinci bir işareti olmaz; kalan nokta kendi adı ve rengiyle durur.
// ISU_KAYNAK kuyularla %67, ISU_MEMBA kuyularla %14, ISU_ISUDEPO gerçek depo
// kayıtlarıyla %87 çakışıyordu (2026.09.29 ölçümü) — bu yüzden üçü de canlı
// asset listesine göre isuYenile() ile her güncellemede yeniden hesaplanır.
const ISU_ESIK_M = 30;
const ISU_KATMAN = {
  kaynak: { veri: ISU_KAYNAK, suzgec: 'kaynak', sinif: 'ref-kaynak', glyph: 'Kn', ad: 'ISU Kaynak noktası (referans)', eslesir: ['kuyu'] },
  memba: { veri: ISU_MEMBA, suzgec: 'memba', sinif: 'ref-memba', glyph: 'Mb', ad: 'ISU Memba noktası (referans)', eslesir: ['kuyu'] },
  depo: { veri: ISU_ISUDEPO, suzgec: 'depo', sinif: 'ref-depo', glyph: 'D', ad: 'ISU Depo noktası (referans)', eslesir: ['depo'] }
};
// ── Görünüm yöneticisi (2026.10.06): yalnız ekranda görünen işaretler çizilir.
// Uzaktan (zoom < 12) kayıtlar canvas üzerinde küçük renkli noktalardır (DOM'a hiç dokunmaz);
// yakınlaşınca ve yalnız ekrandaki en çok DOM_SINIR işaret simgeli çizilir; etiketler 14'ten sonra.
// Telefonda 900+ DOM işaretini aynı anda döndürmek haritayı kilitliyordu.
const DOM_ZOOM = 12, DOM_SINIR = 260;
const TUR_RENK = { kuyu: '#0071e3', depo: '#b45309', ag: '#7b3fbf', ges: '#c08a00', kaynak: '#0891b2', memba: '#15803d' };
const goruntuKatman = L.layerGroup().addTo(map);
const noktaLayer = L.layerGroup().addTo(map);
let ogeler = [], canli = new Map(), ogeImza = '', gz = null;

function ogeleriKur() {
  const imza = assets.length + '|' + assets.map(a => a.id + a.type + a.status + a.sync + a.lat + a.lon).join(',').length + '|' + [...openFaults].join(',');
  if (imza === ogeImza) { ogeAcik(); gorunumGuncelle(); return; }
  ogeImza = imza;
  ogeler = [];
  for (const a of assets) ogeler.push({ key: 'a' + a.id, kind: 'a', tur: a.type, lat: a.lat, lon: a.lon, a });
  for (const [ad, isu] of Object.entries(ISU_KATMAN)) {
    const gercekler = assets.filter(a => isu.eslesir.includes(a.type)).map(a => [a.lat, a.lon]);
    for (const [lat, lon] of isu.veri) {
      if (gercekler.some(g => hatMesafe([lat, lon], g) < ISU_ESIK_M)) continue;
      ogeler.push({ key: 'i' + ad + lat + ',' + lon, kind: 'isu', tur: ad, lat, lon, isu });
    }
  }
  goruntuKatman.clearLayers(); canli.clear();
  ogeAcik();
  gorunumGuncelle();
}
function ogeAcik() {
  const f = sonFilter;
  for (const o of ogeler) {
    o.on = o.kind === 'a'
      ? (!f || (!!f[o.tur] && (f.pasif !== false || o.a.status !== 'pasif')))
      : (!!f && !!f[o.isu.suzgec]);
  }
}
function ogeTikla(o) {
  if (o.kind === 'a') {
    if (navMode) routeTo(o.a);
    else parent.postMessage({ ks: 'select', id: o.a.id, code: o.a.code }, '*');
    return;
  }
  if (pickName) {
    const n = pickName; setPick(null);
    parent.postMessage({ ks: 'picked', name: n, lat: +o.lat.toFixed(6), lon: +o.lon.toFixed(6) }, '*');
    return;
  }
  noktaBirak({ lat: o.lat, lng: o.lon });
}
function isaretYap(o, mod) {
  const a = o.a;
  const pasif = o.kind === 'a' && a.status === 'pasif', pend = o.kind === 'a' && a.sync === 'pending';
  const fault = o.kind === 'a' && openFaults.has(a.id);
  let mk;
  if (mod === 'n') {
    mk = L.circleMarker([o.lat, o.lon], {
      radius: o.kind === 'a' ? 5 : 3, weight: fault ? 2.5 : 1.5, color: fault ? '#d70015' : '#fff',
      fillColor: TUR_RENK[o.tur] || '#0071e3', fillOpacity: pasif ? .35 : .95
    });
  } else {
    mk = L.marker([o.lat, o.lon], { icon: ksPin(o.tur, { ref: o.kind === 'isu', pasif, pend, fault }), keyboard: false });
  }
  if (o.kind === 'a') {
    mk.bindPopup(() =>
      `<b>${a.code}</b><br>${TYPES[a.type].kind}<br>${a.village || 'Köy girilmedi'} · ${a.district}` +
      `<br>Yapım yılı: ${a.year || '—'}<br>${a.photos} fotoğraf` +
      (fault ? '<br><b style="color:#0071e3">Açık arıza kaydı var</b>' : '') +
      (a.coordApprox ? '<br><i>Konum yaklaşık — saha ölçümü bekliyor</i>' : '<br><i>Konum: KML / saha ölçümü</i>'));
    if (mod === 'e') {
      mk.bindTooltip(a.code, { permanent: true, direction: 'right', className: 'ks-lbl', offset: [18, 0], interactive: true });
      const tt = mk.getTooltip();
      if (tt) tt.on('click', () => ogeTikla(o));
    } else if (mod === 'd') mk.bindTooltip(a.code, { direction: 'right', className: 'ks-lbl', offset: [18, 0] });
  } else {
    mk.bindTooltip(o.isu.ad, { direction: 'top' });
  }
  // açılır pencere yerine doğrudan seçim: tıklama programa gider (eski davranış)
  mk.on('click', () => { if (o.kind === 'a') { mk.closePopup(); } ogeTikla(o); });
  return mk;
}
function gorunumGuncelle() {
  const z = map.getZoom(), dom = z >= DOM_ZOOM;
  const mod = dom ? (wantLabels && z >= ETIKET_ZOOM ? 'e' : 'd') : 'n';
  const b = map.getBounds().pad(dom ? .15 : .3), mrk = map.getCenter();
  let ad = [];
  for (const o of ogeler) {
    if (!o.on || (o.kind === 'isu' && !dom)) continue;
    if (b.contains([o.lat, o.lon])) ad.push(o);
  }
  if (dom && ad.length > DOM_SINIR) {
    ad.forEach(o => { o._d = (o.lat - mrk.lat) ** 2 + (o.lon - mrk.lng) ** 2; });
    ad.sort((x, y) => x._d - y._d);
    ad.length = DOM_SINIR;
  }
  const hedef = new Set(ad.map(o => o.key));
  for (const [k, c] of canli) {
    if (!hedef.has(k) || c.mod !== mod) { goruntuKatman.removeLayer(c.mk); canli.delete(k); }
  }
  for (const o of ad) {
    if (canli.has(o.key)) continue;
    const mk = isaretYap(o, mod);
    mk.addTo(goruntuKatman);
    canli.set(o.key, { mk, mod });
  }
}
function gorunumPlan() { clearTimeout(gz); gz = setTimeout(gorunumGuncelle, 100); }
map.on('moveend zoomend', gorunumPlan);

let wantLabels = true;
function cizAssets() {
  // Arıza noktaları: ekibin sahada kaydettiği koordinat (boru hattı arızası
  // tesisin yerinde değildir). Açık arızalar kırmızı, dokununca arıza açılır.
  noktaLayer.clearLayers();
  for (const f of faults) {
    if (!f || !f.nokta || KAPALI.includes(f.status)) continue;
    const yer = f.koy ? f.koy + (f.district ? ' · ' + f.district : '') : (f.district || '');
    L.circleMarker([f.nokta.lat, f.nokta.lon], { radius: 9, color: '#fff', weight: 2.5, fillColor: '#d70015', fillOpacity: .95 })
      .bindPopup(`<b>${f.no || 'Arıza'}</b><br>${f.type || ''}<br>${yer}` +
        `<br><i>Arıza noktası${f.noktaDogruluk != null ? ' · ±' + f.noktaDogruluk + ' m' : ''}</i>`)
      .on('click', () => parent.postMessage({ ks: 'arizaAc', id: f.id }, '*'))
      .addTo(noktaLayer);
  }
  ogeleriKur();
}
function filtreUygula(f) {
  sonFilter = f;
  ogeAcik();
  gorunumGuncelle();
}
function applyLabels() {
  document.getElementById('t-labels').classList.toggle('on', wantLabels);
  gorunumGuncelle();
}

const bounds = L.latLngBounds(assets.map(a => [a.lat, a.lon]));
// açılış görünümü: her zaman Kırşehir il sınırlarını kapsar
const IL_BOUNDS = L.latLngBounds([38.76, 33.28], [39.80, 34.66]);
let ilkOturdu = false;
const ilGorunumu = () => {
  if (ilkOturdu) return;
  map.invalidateSize();
  const b = map.getContainer().getBoundingClientRect();
  if (b.width < 40 || b.height < 40) return;   // kap henüz ölçülmedi
  map.fitBounds(IL_BOUNDS, { padding: [12, 12] });
  ilkOturdu = true;
};
map.whenReady(ilGorunumu);
requestAnimationFrame(ilGorunumu);
addEventListener('resize', ilGorunumu);
map.on('resize', ilGorunumu);
setTimeout(ilGorunumu, 300);
if (typeof ResizeObserver === 'function') new ResizeObserver(ilGorunumu).observe(map.getContainer());
const ilKilitle = () => { ilkOturdu = true; };

// ── konumum (standart saha konumu) + yol tarifi
const STD = { lat: 39.1462, lon: 34.1583, label: 'Kırşehir merkez · standart saha konumu' };
let me = { ...STD };
const meMarker = L.marker([me.lat, me.lon], {
  icon: L.divIcon({ className: '', iconSize: [18, 18], iconAnchor: [9, 9], html: '<div class="ks-me"></div>' })
}).bindTooltip('Konumum', { direction: 'top', offset: [0, -10] }).addTo(map);

let navMode = false, routeLine = null;
function setNav(on) {
  navMode = on;
  document.getElementById('t-nav').classList.toggle('on', on);
  document.getElementById('map').style.cursor = on ? 'crosshair' : '';
}
document.getElementById('t-nav').onclick = () => setNav(!navMode);

function goToMe(coords) {
  if (coords) { me = { lat: coords.lat, lon: coords.lon, label: coords.label || 'Cihaz GPS konumu' }; }
  meMarker.setLatLng([me.lat, me.lon]);
  map.flyTo([me.lat, me.lon], 14, { duration: .8 });
}
const post = m => parent.postMessage(m, '*');
function konumBul(sessiz) {
  if (!navigator.geolocation) return goToMe(STD);
  navigator.geolocation.getCurrentPosition(
    p => {
      goToMe({ lat: p.coords.latitude, lon: p.coords.longitude, label: `Cihaz GPS · ±${Math.round(p.coords.accuracy)} m` });
      post({ ks: 'konum', lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy) });
    },
    err => { goToMe(STD); if (!sessiz) post({ ks: 'konumYok', kod: err.code }); },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
  );
}
document.getElementById('t-go').onclick = () => konumBul();

const rt = id => document.getElementById(id);
function showRoute(a, km, min, note) {
  rt('rt-title').textContent = `${a.code} · ${a.village}`;
  rt('rt-km').textContent = km;
  rt('rt-min').textContent = min;
  rt('rt-note').textContent = note;
  rt('rt-ext').href = `https://www.google.com/maps/dir/?api=1&origin=${me.lat},${me.lon}&destination=${a.lat},${a.lon}&travelmode=driving`;
  rt('route').classList.add('show');
}
rt('rt-clear').onclick = () => {
  if (routeLine) { routeLine.remove(); routeLine = null; }
  rt('route').classList.remove('show');
};

async function routeTo(a) {
  if (routeLine) { routeLine.remove(); routeLine = null; }
  const straight = map.distance([me.lat, me.lon], [a.lat, a.lon]) / 1000;
  routeLine = L.polyline([[me.lat, me.lon], [a.lat, a.lon]],
    { color: '#0071e3', weight: 4, dashArray: '8 7', opacity: .9 }).addTo(map);
  showRoute(a, straight.toFixed(1), '—', 'Kuş uçuşu mesafe — karayolu güzergâhı isteniyor…');
  map.fitBounds(routeLine.getBounds().pad(.25));
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${me.lon},${me.lat};${a.lon},${a.lat}?overview=full&geometries=geojson`;
    const r = await fetch(url);
    const j = await r.json();
    const route = j.routes && j.routes[0];
    if (!route) throw new Error('rota yok');
    routeLine.remove();
    routeLine = L.polyline(route.geometry.coordinates.map(([lo, la]) => [la, lo]),
      { color: '#0071e3', weight: 5, opacity: .95 }).addTo(map);
    map.fitBounds(routeLine.getBounds().pad(.2));
    showRoute(a, (route.distance / 1000).toFixed(1), Math.round(route.duration / 60),
      `Karayolu güzergâhı · ${me.label}. Ekipler için sürüş süresi tahminidir.`);
    parent.postMessage({ ks: 'route', id: a.id, code: a.code, km: +(route.distance / 1000).toFixed(1), min: Math.round(route.duration / 60) }, '*');
  } catch (err) {
    showRoute(a, straight.toFixed(1), Math.round(straight / 55 * 60),
      'Karayolu servisi kapalı (çevrimdışı olabilirsiniz) — kuş uçuşu mesafe ve 55 km/sa varsayımı gösteriliyor.');
    parent.postMessage({ ks: 'route', id: a.id, code: a.code, km: +straight.toFixed(1), min: Math.round(straight / 55 * 60), approx: true }, '*');
  }
}

const ETIKET_ZOOM = 14;
cizAssets();

document.getElementById('t-labels').onclick = () => { wantLabels = !wantLabels; applyLabels(); };
document.getElementById('t-fit').onclick = () => map.fitBounds(bounds.pad(0.08));

const tools = document.getElementById('tools');
document.getElementById('menu').onclick = e => { e.stopPropagation(); tools.classList.toggle('open'); };
// Menü açıkken haritaya, boş bir yere ya da uygulamanın başka bir bölümüne dokunulunca kapanır
const menuKapat = () => tools.classList.remove('open');
map.on('click movestart', menuKapat);
document.addEventListener('pointerdown', e => { if (!tools.contains(e.target)) menuKapat(); });
window.addEventListener('blur', menuKapat);
map.on('movestart', () => tools.classList.remove('open'));

// köy konumu işaretleme modu — kullanıcı haritaya bir kez dokunur, konum kaydedilir
let pickName = null;
function setPick(name) {
  pickName = name;
  document.getElementById('map').style.cursor = name ? 'crosshair' : '';
  const b = document.getElementById('pickbar');
  b.style.display = name ? 'block' : 'none';
  if (name) b.textContent = name + ' köyünün merkezine dokunun — konum kaydedilecek';
}
// Nokta bırakma: masaüstünde ÇİFT tıklama, telefonda basılı tutma.
// Tek tıklama haritada gezinmek için serbest kaldı — sürükleyip yakınlaşmak
// artık koordinat kartını açmıyor.
let coordMode = false, coordMark = null;
function noktaBirak(latlng) {
  parent.postMessage({ ks: 'coord', lat: +latlng.lat.toFixed(6), lon: +latlng.lng.toFixed(6) }, '*');
  if (coordMark) coordMark.remove();
  coordMark = L.circleMarker(latlng, { radius: 8, color: '#0071e3', weight: 3, fillColor: '#fff', fillOpacity: 1 }).addTo(map);
}
// Çift tıklamayı yakınlaştırmaya değil nokta bırakmaya verdik
map.doubleClickZoom.disable();
map.on('dblclick', e => { if (!pickName) noktaBirak(e.latlng); });

// Köy konumu işaretleme ve koordinat modu tek dokunuşta kalır —
// bu ikisinde kullanıcı zaten "bir yere basacağını" bilerek giriyor
map.on('click', e => {
  if (pickName) {
    const n = pickName;
    setPick(null);
    parent.postMessage({ ks: 'picked', name: n, lat: +e.latlng.lat.toFixed(6), lon: +e.latlng.lng.toFixed(6) }, '*');
    return;
  }
  if (coordMode) noktaBirak(e.latlng);
});

// Telefonda basılı tutmak çift tıklamanın karşılığı — bkz. harita-ortak.js
ksUzunBasisKur(map, () => !pickName && !coordMode, noktaBirak);

document.getElementById('t-coord').onclick = () => {
  if (coordMark) { coordMark.remove(); coordMark = null; }
  parent.postMessage({ ks: 'coordMode', on: false }, '*');
};

// dış uygulamadan tema / filtre / rota komutları
addEventListener('message', e => {
  const d = e.data || {};
  if (d.ks === 'theme') document.body.classList.toggle('dark', d.dark);
  if (d.ks === 'fly') { ilKilitle(); map.flyTo([d.lat, d.lon], d.zoom || 13, { duration: .8 }); }
  if (d.ks === 'setBase') setBase(d.base, true);
  if (d.ks === 'navMode') setNav(!!d.on);
  if (d.ks === 'pick') setPick(d.name || null);
  if (d.ks === 'go') { if (d.lat) goToMe({ lat: d.lat, lon: d.lon, label: d.label }); else konumBul(); }
  if (d.ks === 'routeTo') {
    const a = assets.find(x => x.id === d.id)
      || (d.lat ? { id: d.id, code: d.code || 'Yeni kayıt', village: d.village || '', lat: d.lat, lon: d.lon } : null);
    if (a) routeTo(a);
  }
  // Ortak veritabanından gelen kayıtlar: işaretler yeniden çizilir, yoksa
  // programın kimlikleri ile haritanın kimlikleri uyuşmaz ve tıklama boşa gider
  if (d.ks === 'assets' && Array.isArray(d.assets)) {
    assets = d.assets;
    if (Array.isArray(d.faults)) {
      faults = d.faults;
      openFaults = new Set(faults.filter(f => !KAPALI.includes(f.status)).map(f => f.assetId));
    }
    cizAssets();
  }
  if (d.ks === 'hatlar' && Array.isArray(d.hatlar)) {
    hatVeri = d.hatlar;
    cizHatlar();
  }
  if (d.ks === 'hatKatman') hatKatman(d.on);
  if (d.ks === 'filter') {
    try { localStorage.setItem(SUZ_KEY, JSON.stringify(d.filter)); } catch (e) { /* depolama kapalı */ }
    filtreUygula(d.filter);
  }
});
parent.postMessage({ ks: 'ready' }, '*');
</script>
</body>
</html>
