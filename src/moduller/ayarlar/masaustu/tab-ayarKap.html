<!-- ayarlar -->
<sc-if value="{{ tab.ayarKap }}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="flex:1;overflow:auto;min-height:0;background:{{ ui.bg }}">
<sc-if value="{{ ayar.listeAcik }}" hint-placeholder-val="{{ true }}">
<div style="max-width:700px;padding:4px 20px 28px">
<sc-for list="{{ ayarListe }}" as="g" hint-placeholder-count="3">
<div style="padding:22px 4px 7px;font:600 12.5px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.mut }}">{{ g.baslik }}</div>
<div style="border-radius:12px;overflow:hidden;background:{{ ui.surf }};border:1px solid {{ ui.rule }}">
<sc-for list="{{ g.satirlar }}" as="r" hint-placeholder-count="3">
<button onClick="{{ r.git }}" style="all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:14px;min-height:58px;padding:11px 16px;border-bottom:1px solid {{ ui.rule }}" style-hover="background:{{ ui.surf2 }}">
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left">
<span style="font:500 15px/1.25 var(--font-body);letter-spacing:-.015em;color:{{ ui.fg }}">{{ r.ad }}</span>
<span style="font:400 12.5px/1.35 var(--font-body);color:{{ ui.mut }}">{{ r.alt }}</span>
</span>
<span style="flex:none;color:{{ ui.mut }};font:400 18px/1 var(--font-body);opacity:.5">›</span>
</button>
</sc-for>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ ayar.detay }}" hint-placeholder-val="{{ false }}">
<div style="flex:none;display:flex;align-items:center;gap:12px;padding:8px 20px;border-bottom:1px solid {{ ui.rule }};background:{{ ui.surf }};position:sticky;top:0;z-index:3">
<button onClick="{{ ayar.geri }}" style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:5px;padding:7px 12px 7px 8px;border-radius:9px;color:{{ ui.acc }};font:500 14.5px/1 var(--font-body);letter-spacing:-.015em" style-hover="background:{{ ui.surf2 }}"><span style="font-size:19px;line-height:1">‹</span> Ayarlar</button>
<span style="font:600 17px/1.2 var(--font-heading);letter-spacing:-.022em;color:{{ ui.fg }}">{{ ayar.bolumAd }}</span>
</div>
</sc-if>

<sc-if value="{{ ayar.yetki }}" hint-placeholder-val="{{ false }}">
<div style="padding:16px 20px 12px">
<div style="font:600 11px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.acc }};margin-bottom:6px">Roller ve yetkiler</div>
<div class="ks-bilgi" style="font:400 12.5px/1.5 var(--font-body);color:{{ ui.mut }};max-width:760px">{{ perm.note }}</div>
</div>
</sc-if>
