<sc-if value="{{ ayar.veri }}" hint-placeholder-val="{{ false }}">
<!--@dahil moduller/ayarlar/ortak/yedek.html-->
<div style="padding:13px 14px;border-bottom:1px solid {{ ui.rule }};display:flex;flex-direction:column;gap:8px">
<span style="font:600 10.5px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.acc }}">Program sürümü</span>
<span style="font:600 13.5px/1.35 var(--font-body);color:{{ ui.fg }}">{{ surumBilgi.surum }}</span>
<span class="ks-bilgi" style="font:400 12.5px/1.5 var(--font-body);color:{{ ui.mut }}">{{ surumBilgi.not }}</span>
<button onClick="{{ surumBilgi.tazele }}" style="all:unset;box-sizing:border-box;cursor:pointer;border-radius:10px;border:1px solid {{ ui.rule }};color:{{ ui.fg }};font:600 13px/1 var(--font-body);padding:13px 14px;min-height:48px;text-align:center;justify-content:center;display:flex;align-items:center">Programı tazele</button>
<sc-if value="{{ surumBilgi.yerelVar }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ surumBilgi.yereliSil }}" style="all:unset;box-sizing:border-box;cursor:pointer;border-radius:10px;border:1px solid {{ ui.rule }};color:{{ ui.fg }};font:600 13px/1 var(--font-body);padding:13px 14px;min-height:48px;text-align:center;justify-content:center;display:flex;align-items:center">{{ surumBilgi.yerelLabel }}</button>
</sc-if>
</div>
<div style="padding:13px 14px;display:flex;flex-direction:column;gap:10px">
<span style="font:600 10.5px/1 var(--font-body);letter-spacing:-.01em;color:{{ ui.acc }}">Ortak veritabanı — modüller</span>
<span class="ks-bilgi" style="font:400 12px/1.55 var(--font-body);color:{{ ui.mut }};max-width:820px">{{ modulEsitleme.not }}</span>
<span style="font:600 12px/1.5 var(--font-body);color:{{ modulEsitleme.durumFg }};max-width:820px">{{ modulEsitleme.durum }}</span>
<sc-if value="{{ modulEsitleme.bekleyenVar }}" hint-placeholder-val="{{ false }}">
<div style="border-radius:10px;border:1px solid {{ ui.rule }};padding:11px 12px;display:flex;flex-direction:column;gap:5px">
<sc-for list="{{ modulEsitleme.bekleyen }}" as="b" hint-placeholder-count="0">
<span style="font:600 12px/1.4 var(--font-body);color:{{ ui.fg }}">{{ b.ad }} · {{ b.zaman }}</span>
</sc-for>
<span class="ks-bilgi" style="font:400 11.5px/1.4 var(--font-body);color:{{ ui.mut }}">{{ modulEsitleme.izNot }}</span>
</div>
</sc-if>
<sc-if value="{{ modulEsitleme.sunucuVar }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;gap:9px;flex-wrap:wrap">
<button onClick="{{ modulEsitleme.gonder }}" class="btn btn-primary" style="width:100%;justify-content:center;display:flex;align-items:center;min-height:48px;border:none;cursor:pointer;font:600 12px/1 var(--font-body);padding:0 15px;justify-content:flex-start">Kuyruğu gönder</button>
<button onClick="{{ modulEsitleme.yukle }}" style="all:unset;box-sizing:border-box;cursor:pointer;width:100%;justify-content:center;display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:10px;border:1px solid {{ ui.rule }};color:{{ ui.fg }};font:600 11.5px/1 var(--font-body);letter-spacing:-.01em;padding:0 15px">Sunucudan yeniden yükle</button>
</div>
</sc-if>
</div>
</sc-if>
