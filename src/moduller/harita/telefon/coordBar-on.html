<sc-if value="{{ coordBar.on }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:0;right:0;bottom:calc(var(--tel-nav) + 6px);z-index:20;background:{{ ui.fg }};color:{{ ui.bg }};border-top:3px solid var(--color-accent);padding:12px 14px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:10px">
<span style="flex:1;font:600 10.5px/1 var(--font-body);letter-spacing:-.01em;color:var(--color-accent)">Dokunulan nokta</span>
<button onClick="{{ coordBar.kapat }}" title="Kapat" style="all:unset;box-sizing:border-box;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid {{ ui.bg }};color:{{ ui.bg }}">{{ ikonlar.kapat }}</button>
</div>
<div style="display:flex;flex-direction:column;gap:5px">
<span style="font:600 14.5px/1.2 ui-monospace,Menlo,monospace">{{ coordBar.wgs }}</span>
<span style="font:600 12.5px/1.3 ui-monospace,Menlo,monospace;opacity:.78">{{ coordBar.dms }}</span>
<span style="font:600 12.5px/1.3 ui-monospace,Menlo,monospace;opacity:.78">{{ coordBar.itrf }}</span>
</div>
<div style="display:flex;gap:7px;flex-wrap:wrap">
<button onClick="{{ coordBar.kopyala }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:1 1 auto;text-align:center;border-radius:10px;border:1px solid {{ ui.bg }};color:{{ ui.bg }};font:600 11.5px/1 var(--font-body);letter-spacing:-.01em;padding:14px 10px;min-height:48px">Kopyala</button>
<button onClick="{{ coordBar.donustur }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:1 1 auto;text-align:center;border-radius:10px;border:1px solid {{ ui.bg }};color:{{ ui.bg }};font:600 11.5px/1 var(--font-body);letter-spacing:-.01em;padding:14px 10px;min-height:48px">Dönüştür</button>
<sc-if value="{{ coordBar.canCreate }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ coordBar.yeniTesis }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:1 1 100%;text-align:center;border-radius:10px;border:1px solid var(--color-accent);background:var(--color-accent);color:#fff;font:600 12px/1 var(--font-body);letter-spacing:-.01em;padding:14px 10px;min-height:48px">Buraya tesis kur</button>
</sc-if>
</div>
</div>
</sc-if>
