<sc-if value="{{ envKontrol.sayfaVar }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 16px 22px">
<button onClick="{{ envKontrol.onceki }}" style="all:unset;box-sizing:border-box;cursor:pointer;border-radius:10px;border:1px solid {{ ui.rule }};color:{{ ui.fg }};font:600 12.5px/1 var(--font-body);padding:0 14px;min-height:40px;display:flex;align-items:center;opacity:{{ envKontrol.oncekiOp }}">‹ Önceki</button>
<span style="font:500 12.5px/1.3 var(--font-body);color:{{ ui.mut }};min-width:110px;text-align:center">{{ envKontrol.sayfaMetin }}</span>
<button onClick="{{ envKontrol.sonraki }}" style="all:unset;box-sizing:border-box;cursor:pointer;border-radius:10px;border:1px solid {{ ui.rule }};color:{{ ui.fg }};font:600 12.5px/1 var(--font-body);padding:0 14px;min-height:40px;display:flex;align-items:center;opacity:{{ envKontrol.sonrakiOp }}">Sonraki ›</button>
</div>
</sc-if>
