<sc-if value="{{ tab.ariza }}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="flex:1;overflow:auto;min-height:0">
<div style="display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid {{ ui.rule }};background:{{ ui.surf }}">
<span style="flex:1;font:600 17px/1.1 var(--font-heading);letter-spacing:-.022em">Arızalar</span>
<button onClick="{{ newFault }}" class="btn btn-primary" style="border:none;cursor:pointer;font:600 12px/1 var(--font-body);padding:10px 12px;justify-content:flex-start">Yeni kayıt</button>
</div>
<div style="display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-bottom:1px solid {{ ui.rule }};background:{{ ui.surf }}">
<input value="{{ arzKontrol.q }}" onChange="{{ arzKontrol.onQ }}" placeholder="Arızada ara — no, kayıt, tür, ekip" style="all:unset;box-sizing:border-box;width:100%;border-radius:10px;border:1px solid {{ ui.rule }};background:{{ ui.bg }};color:{{ ui.fg }};font:600 13px/1 var(--font-body);padding:12px 11px;min-height:46px"></input>
<button onClick="{{ telSuz.arzTog }}" style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid {{ telSuz.arzKenar }};background:{{ ui.bg }};color:{{ ui.fg }};font:600 13px/1 var(--font-body)"><span>Süzgeç ve sıralama</span><span style="color:{{ ui.mut }};font-size:11px">{{ telSuz.arzEtiket }} {{ telSuz.arzOk }}</span></button>
<sc-if value="{{ telSuz.arzAcik }}" hint-placeholder-val="{{ false }}">
<div class="ks-gir" style="display:flex;flex-direction:column;gap:8px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<select value="{{ arzKontrol.oncelikVal }}" onChange="{{ arzKontrol.onOncelik }}" style="all:unset;box-sizing:border-box;width:100%;border-radius:10px;border:1px solid {{ ui.rule }};background:{{ ui.bg }};color:{{ ui.fg }};font:600 12.5px/1 var(--font-body);padding:11px 8px;min-height:44px;cursor:pointer"><sc-for list="{{ arzKontrol.oncelikler }}" as="o" hint-placeholder-count="5"><option value="{{ o.v }}">{{ o.n }}</option></sc-for></select>
<select value="{{ arzKontrol.durumVal }}" onChange="{{ arzKontrol.onDurum }}" style="all:unset;box-sizing:border-box;width:100%;border-radius:10px;border:1px solid {{ ui.rule }};background:{{ ui.bg }};color:{{ ui.fg }};font:600 12.5px/1 var(--font-body);padding:11px 8px;min-height:44px;cursor:pointer"><sc-for list="{{ arzKontrol.durumlar }}" as="o" hint-placeholder-count="5"><option value="{{ o.v }}">{{ o.n }}</option></sc-for></select>
<select value="{{ arzKontrol.ekipVal }}" onChange="{{ arzKontrol.onEkip }}" style="all:unset;box-sizing:border-box;width:100%;border-radius:10px;border:1px solid {{ ui.rule }};background:{{ ui.bg }};color:{{ ui.fg }};font:600 12.5px/1 var(--font-body);padding:11px 8px;min-height:44px;cursor:pointer"><sc-for list="{{ arzKontrol.ekipler }}" as="o" hint-placeholder-count="4"><option value="{{ o.v }}">{{ o.n }}</option></sc-for></select>
<div style="display:flex;gap:8px;min-width:0">
<select value="{{ arzKontrol.siraVal }}" onChange="{{ arzKontrol.onSira }}" style="all:unset;box-sizing:border-box;width:100%;border-radius:10px;border:1px solid {{ ui.rule }};background:{{ ui.bg }};color:{{ ui.fg }};font:600 12.5px/1 var(--font-body);padding:11px 8px;min-height:44px;cursor:pointer"><sc-for list="{{ arzKontrol.siraOpts }}" as="o" hint-placeholder-count="7"><option value="{{ o.v }}">{{ o.n }}</option></sc-for></select>
<button onClick="{{ arzKontrol.yonTik }}" title="Sıra yönünü çevir" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;border-radius:10px;border:1px solid {{ ui.rule }};color:{{ ui.fg }};font:600 11.5px/1 var(--font-body);letter-spacing:-.01em;padding:0 12px;min-height:36px;flex:1 0 auto;white-space:nowrap;justify-content:center;display:flex;align-items:center">{{ arzKontrol.yon }}</button>
</div>
</div>
</div>
</sc-if>
<div style="display:flex;align-items:center;gap:10px">
<span style="flex:1;font:400 12px/1.35 var(--font-body);color:{{ ui.mut }}">{{ arzKontrol.sayi }}</span>
<sc-if value="{{ arzKontrol.suzuluyor }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ arzKontrol.temizle }}" style="all:unset;box-sizing:border-box;cursor:pointer;border-radius:10px;border:1px solid {{ ui.rule }};color:{{ ui.mut }};font:600 11.5px/1 var(--font-body);letter-spacing:-.01em;padding:0 12px;min-height:36px;flex:1 0 auto;white-space:nowrap;justify-content:center;display:flex;align-items:center">Temizle</button>
</sc-if>
</div>
</div>
<sc-if value="{{ arzKontrol.bosMu }}" hint-placeholder-val="{{ false }}">
<div style="padding:20px 14px;font:400 12.5px/1.5 var(--font-body);color:{{ ui.mut }}">{{ arzKontrol.bosNot }}</div>
</sc-if>
<sc-for list="{{ faults }}" as="f" hint-placeholder-count="5">
<button onClick="{{ f.tap }}" style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;width:100%;gap:11px;padding:12px 14px;border-bottom:1px solid {{ ui.rule }};align-items:flex-start;text-align:left">
<span style="flex:none;width:8px;height:8px;margin-top:5px;background:{{ f.pBorder }}"></span>
<span style="flex:1;display:flex;flex-direction:column;gap:3px;min-width:0">
<span style="font:600 13.5px/1.2 var(--font-heading);color:{{ ui.fg }}">{{ f.type }}</span>
<span style="font:400 12.5px/1.35 var(--font-body);color:{{ ui.mut }}">{{ f.assetCode }} · {{ f.crew }} · {{ f.opened }}</span>
<sc-if value="{{ f.sureVar }}" hint-placeholder-val="{{ false }}">
<span style="font:600 11.5px/1.3 var(--font-body);color:{{ f.sureFg }}">Hedef {{ f.sure }}</span>
</sc-if>
</span>
<span style="flex:none;font:600 10.5px/1 var(--font-body);letter-spacing:-.01em;color:{{ f.pBorder }}">{{ f.status }}</span>
</button>
</sc-for>
</div>
</sc-if>
